<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aim Trainer 3D • Gridshot &amp; Tracker (Valorant)</title>
<style>
  :root {
    --accent: #00e5ff;
    --bg-ui: #05070b;
    --border: rgba(255, 255, 255, 0.1);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000000;
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .trainer-shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* BARRA SUPERIOR DE CONTROLES */
  .top-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 7px 10px;
    background: rgba(6, 9, 14, 0.96);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .mode-tabs {
    display: flex;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 3px;
    gap: 3px;
  }
  .mode-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.2px;
  }
  .mode-btn:hover { color: #fff; }
  .mode-btn.active {
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    color: var(--accent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent);
  }

  .btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-start {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .btn-start:hover { background: var(--accent); filter: brightness(1.1); }
  .btn-pause {
    background: rgba(251, 191, 36, 0.16);
    border-color: rgba(251, 191, 36, 0.45);
    color: #fde047;
  }
  .btn-stop {
    background: rgba(239, 68, 68, 0.16);
    border-color: rgba(239, 68, 68, 0.45);
    color: #f87171;
  }

  .field {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 3px 7px;
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 600;
  }
  .field input[type="number"] {
    width: 50px;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: var(--accent);
    font-weight: 700;
    font-size: 11px;
    border-radius: 5px;
    padding: 2px 4px;
    text-align: center;
    outline: none;
  }
  .field input[type="range"] {
    width: 58px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .field select {
    background: #0d1118;
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    border-radius: 5px;
    padding: 2px 5px;
    outline: none;
    cursor: pointer;
  }
  .field input[type="color"] {
    width: 20px;
    height: 18px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }

  /* VIEWPORT 3D */
  .viewport-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    overflow: hidden;
    background: #000;
  }
  #threeCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }

  /* HUD SUPERIOR NO JOGO */
  .hud-top {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 10;
    pointer-events: none;
  }
  .hud-pill {
    background: rgba(5, 8, 14, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 5px 12px;
    text-align: center;
    min-width: 80px;
  }
  .hud-pill .lbl {
    font-size: 8.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .hud-pill .val {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .hud-pill.accent .val { color: var(--accent); }
  .hud-pill.gold .val { color: #ffd700; }

  /* INDICADOR ON-TARGET DO TRACKER */
  .tracker-badge {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 10px;
    background: rgba(5, 8, 14, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 99px;
    padding: 7px 18px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.7px;
    pointer-events: none;
    z-index: 11;
    transition: border-color 0.12s, color 0.12s, box-shadow 0.12s;
  }
  .tracker-badge.visible { display: inline-flex; }
  .tracker-badge.locked {
    color: #4ade80;
    border-color: rgba(74, 222, 128, 0.65);
    box-shadow: 0 0 18px rgba(74, 222, 128, 0.25);
  }

  /* MIRA CENTRAL */
  .crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 24px;
    height: 24px;
    pointer-events: none;
    z-index: 12;
    display: none;
  }
  .crosshair.visible { display: block; }
  .crosshair span {
    position: absolute;
    background: #00ffdd;
    box-shadow: 0 0 2px #000, 0 0 4px rgba(0, 0, 0, 0.9);
    transition: background 0.08s;
  }
  .crosshair.on-target span {
    background: #4ade80;
    box-shadow: 0 0 6px #4ade80, 0 0 2px #000;
  }
  .ch-top    { width: 2px; height: 6px; left: 11px; top: 2px; }
  .ch-bottom { width: 2px; height: 6px; left: 11px; bottom: 2px; }
  .ch-left   { height: 2px; width: 6px; top: 11px; left: 2px; }
  .ch-right  { height: 2px; width: 6px; top: 11px; right: 2px; }
  .ch-dot    { width: 2px; height: 2px; left: 11px; top: 11px; border-radius: 50%; }

  /* HITMARKER */
  .hitmarker {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%) scale(0.7);
    opacity: 0;
    pointer-events: none;
    z-index: 13;
    transition: opacity 0.1s ease, transform 0.1s ease;
  }
  .hitmarker.show { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }

  /* OVERLAY CENTRAL */
  .center-overlay {
    position: absolute;
    inset: 0;
    z-index: 16;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(2, 4, 8, 0.74);
    backdrop-filter: blur(6px);
  }
  .center-overlay.hidden { display: none; }

  .overlay-card {
    width: 92%;
    max-width: 480px;
    background: rgba(10, 14, 22, 0.95);
    border: 1px solid color-mix(in srgb, var(--accent) 42%, rgba(255, 255, 255, 0.12));
    border-radius: 16px;
    padding: 24px 26px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
  }
  .overlay-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    padding: 4px 10px;
    border-radius: 99px;
    margin-bottom: 10px;
  }
  .overlay-title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 6px; }
  .overlay-desc { font-size: 12.5px; color: var(--muted); line-height: 1.48; margin-bottom: 16px; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .stat-box { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 9px 6px; }
  .stat-box .k { font-size: 9px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .stat-box .v { font-size: 17px; font-weight: 900; color: var(--accent); margin-top: 3px; }
  .overlay-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="trainer-shell" id="trainerShell">
  <!-- BARRA SUPERIOR -->
  <div class="top-controls">
    <div class="ctrl-group">
      <div class="mode-tabs">
        <button class="mode-btn active" id="btnModeGridshot">Gridshot 3D</button>
        <button class="mode-btn" id="btnModeTracker">Tracker 3D</button>
      </div>
      <button class="btn btn-start" id="btnStart">▶ Iniciar</button>
      <button class="btn btn-pause" id="btnPause" disabled>⏸ Pausar</button>
      <button class="btn btn-stop" id="btnStop" disabled>■ Parar</button>
      <button class="btn" id="btnFullscreen" title="Tela Cheia">⛶</button>
    </div>

    <div class="ctrl-group">
      <label class="field" id="diffField" title="Ajusta a velocidade e tamanho da bolinha no Tracker 3D">
        Dificuldade
        <select id="diffSelect">
          <option value="easy">Fácil</option>
          <option value="normal">Normal</option>
          <option value="hard" selected>Difícil</option>
          <option value="insane">Pro / Insano</option>
        </select>
      </label>

      <label class="field" title="Sensibilidade 100% Valorant (0.07° por count, FOV 103°, raw input)">
        Sensi Valorant
        <input type="range" id="sensSlider" min="0.05" max="2.50" step="0.01" value="0.35">
        <input type="number" id="sensNumber" min="0.05" max="5.00" step="0.01" value="0.35">
      </label>

      <label class="field">
        Tempo
        <select id="timeSelect">
          <option value="30">30s</option>
          <option value="60" selected>60s</option>
          <option value="90">90s</option>
          <option value="120">120s</option>
          <option value="0">Livre</option>
        </select>
      </label>

      <label class="field" title="Cor do fundo da arena">
        Fundo
        <input type="color" id="bgColorPicker" value="#0a101b">
      </label>

      <label class="field" title="Cor das bolinhas">
        Bolinhas
        <input type="color" id="targetColorPicker" value="#00e5ff">
      </label>
    </div>
  </div>

  <!-- VIEWPORT 3D -->
  <div class="viewport-wrap" id="viewportWrap">
    <canvas id="threeCanvas"></canvas>

    <!-- HUD SUPERIOR -->
    <div class="hud-top">
      <div class="hud-pill accent">
        <div class="lbl">Tempo</div>
        <div class="val" id="hudTime">60.0s</div>
      </div>
      <div class="hud-pill">
        <div class="lbl" id="hudPrimaryLbl">Pontos</div>
        <div class="val" id="hudScore">0</div>
      </div>
      <div class="hud-pill">
        <div class="lbl" id="hudHitsLbl">Acertos</div>
        <div class="val" id="hudHits">0</div>
      </div>
      <div class="hud-pill">
        <div class="lbl" id="hudAccLbl">Precisão</div>
        <div class="val" id="hudAcc">100%</div>
      </div>
      <div class="hud-pill gold">
        <div class="lbl" id="hudExtraLbl">Reação</div>
        <div class="val" id="hudExtra">--</div>
      </div>
    </div>

    <!-- INDICADOR TRACKER -->
    <div class="tracker-badge" id="trackerBadge">MANTENHA A MIRA NA BOLINHA</div>

    <!-- MIRA CENTRAL -->
    <div class="crosshair" id="crosshair">
      <span class="ch-top"></span>
      <span class="ch-bottom"></span>
      <span class="ch-left"></span>
      <span class="ch-right"></span>
      <span class="ch-dot"></span>
    </div>

    <!-- HITMARKER -->
    <div class="hitmarker" id="hitmarker">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
        <line x1="4" y1="4" x2="9" y2="9"/>
        <line x1="20" y1="4" x2="15" y2="9"/>
        <line x1="4" y1="20" x2="9" y2="15"/>
        <line x1="20" y1="20" x2="15" y2="15"/>
      </svg>
    </div>

    <!-- OVERLAY CENTRAL -->
    <div class="center-overlay" id="centerOverlay">
      <div class="overlay-card">
        <div class="overlay-badge" id="ovBadge">AIMLAB GRIDSHOT 3D • VALORANT</div>
        <div class="overlay-title" id="ovTitle">Pronto para Treinar</div>
        <div class="overlay-desc" id="ovDesc"></div>
        <div class="stats-grid" id="ovStats" style="display: none;">
          <div class="stat-box"><div class="k" id="stLbl1">Pontos</div><div class="v" id="stVal1">0</div></div>
          <div class="stat-box"><div class="k" id="stLbl2">Precisão</div><div class="v" id="stVal2">0%</div></div>
          <div class="stat-box"><div class="k" id="stLbl3">Reação</div><div class="v" id="stVal3">--</div></div>
        </div>
        <div class="overlay-actions">
          <button class="btn btn-start" id="ovPrimaryBtn" style="padding: 10px 26px; font-size: 13px;">▶ INICIAR TREINO</button>
          <button class="btn btn-stop" id="ovStopBtn" style="display: none; padding: 10px 18px; font-size: 13px;">■ Encerrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  if (typeof THREE === 'undefined') {
    document.getElementById('ovTitle').textContent = 'Erro ao carregar motor 3D';
    return;
  }

  // ================= DIFICULDADES DO TRACKER 3D =================
  const DIFF_PROFILES = {
    easy:   { label: 'Fácil',        trackerRadius: 0.68, trackerSpeed: 4.2, trackerDirInterval: [1.1, 2.0] },
    normal: { label: 'Normal',       trackerRadius: 0.56, trackerSpeed: 5.8, trackerDirInterval: [0.75, 1.45] },
    hard:   { label: 'Difícil',      trackerRadius: 0.46, trackerSpeed: 7.4, trackerDirInterval: [0.45, 1.0] },
    insane: { label: 'Pro / Insano', trackerRadius: 0.38, trackerSpeed: 9.2, trackerDirInterval: [0.28, 0.72] }
  };

  // ================= ESTADO & CONFIGURAÇÕES =================
  const VAL_YAW_DEG = 0.07;  // Exato do Valorant: 0.07° por mouse count
  const VAL_HFOV_DEG = 103;  // FOV horizontal oficial do Valorant

  const savedMode = localStorage.getItem('aim3d_mode');
  const cfg = {
    mode: savedMode === 'tracker' ? 'tracker' : 'gridshot',
    diff: localStorage.getItem('aim3d_diff') || 'hard',
    sens: parseFloat(localStorage.getItem('aim3d_sens') || '0.35'),
    duration: parseInt(localStorage.getItem('aim3d_time') || '60', 10),
    bgColor: localStorage.getItem('aim3d_bg') || '#0a101b',
    targetColor: localStorage.getItem('aim3d_target') || '#00e5ff'
  };

  function getDiff() { return DIFF_PROFILES[cfg.diff] || DIFF_PROFILES.hard; }

  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'ended'
  let timeLeft = cfg.duration;
  let elapsedTime = 0;

  const stats = {
    score: 0,
    hits: 0,
    shots: 0,
    reactionSum: 0,
    reactionCount: 0,
    streak: 0,
    trackOnSec: 0,
    trackTotalSec: 0,
    trackStreakSec: 0,
    trackBestStreakSec: 0
  };

  function syncAccentFromStorage() {
    const accent = localStorage.getItem('particlesColor') || '#00e5ff';
    document.documentElement.style.setProperty('--accent', accent);
  }
  syncAccentFromStorage();
  window.addEventListener('storage', syncAccentFromStorage);

  // ================= REFERÊNCIAS DE UI =================
  const canvas = document.getElementById('threeCanvas');
  const viewportWrap = document.getElementById('viewportWrap');
  const trainerShell = document.getElementById('trainerShell');
  const btnModeGridshot = document.getElementById('btnModeGridshot');
  const btnModeTracker = document.getElementById('btnModeTracker');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');
  const btnStop = document.getElementById('btnStop');
  const btnFullscreen = document.getElementById('btnFullscreen');
  const diffField = document.getElementById('diffField');
  const diffSelect = document.getElementById('diffSelect');
  const sensSlider = document.getElementById('sensSlider');
  const sensNumber = document.getElementById('sensNumber');
  const timeSelect = document.getElementById('timeSelect');
  const bgColorPicker = document.getElementById('bgColorPicker');
  const targetColorPicker = document.getElementById('targetColorPicker');

  const hudTime = document.getElementById('hudTime');
  const hudScore = document.getElementById('hudScore');
  const hudHits = document.getElementById('hudHits');
  const hudAcc = document.getElementById('hudAcc');
  const hudExtra = document.getElementById('hudExtra');
  const hudPrimaryLbl = document.getElementById('hudPrimaryLbl');
  const hudHitsLbl = document.getElementById('hudHitsLbl');
  const hudAccLbl = document.getElementById('hudAccLbl');
  const hudExtraLbl = document.getElementById('hudExtraLbl');
  const trackerBadge = document.getElementById('trackerBadge');

  const crosshairEl = document.getElementById('crosshair');
  const hitmarkerEl = document.getElementById('hitmarker');
  const centerOverlay = document.getElementById('centerOverlay');
  const ovBadge = document.getElementById('ovBadge');
  const ovTitle = document.getElementById('ovTitle');
  const ovDesc = document.getElementById('ovDesc');
  const ovStats = document.getElementById('ovStats');
  const ovPrimaryBtn = document.getElementById('ovPrimaryBtn');
  const ovStopBtn = document.getElementById('ovStopBtn');

  diffSelect.value = cfg.diff;
  sensSlider.value = Math.min(2.5, Math.max(0.05, cfg.sens));
  sensNumber.value = cfg.sens.toFixed(2);
  timeSelect.value = String(cfg.duration);
  bgColorPicker.value = cfg.bgColor;
  targetColorPicker.value = cfg.targetColor;

  const hudCache = { time: '', score: '', hits: '', acc: '', extra: '' };

  // ================= ÁUDIO SINTÉTICO OFFLINE =================
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }

  function playSound(type) {
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'grid-hit') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(680, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.055);
      gain.gain.setValueAtTime(0.17, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.start(now); osc.stop(now + 0.075);
    } else if (type === 'track-tick') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(920, now);
      osc.frequency.exponentialRampToValueAtTime(1060, now + 0.025);
      gain.gain.setValueAtTime(0.055, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
      osc.start(now); osc.stop(now + 0.035);
    } else if (type === 'miss') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.055);
      gain.gain.setValueAtTime(0.07, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now); osc.stop(now + 0.065);
    }
  }

  let hitmarkerTimer = null;
  function flashHitmarker() {
    hitmarkerEl.classList.add('show');
    clearTimeout(hitmarkerTimer);
    hitmarkerTimer = setTimeout(() => hitmarkerEl.classList.remove('show'), 110);
  }

  // ================= TEXTURA PROCEDURAL DA SALA AIMLAB 3D =================
  function makeGridTileTexture(baseHex) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    const col = new THREE.Color(baseHex);
    ctx.fillStyle = `rgb(${Math.round(col.r * 255)},${Math.round(col.g * 255)},${Math.round(col.b * 255)})`;
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 6000; i++) {
      const a = Math.random() * 0.045;
      ctx.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.4})`;
      ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for (let i = 0; i <= 512; i += 128) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }

  // ================= RENDERER THREE.JS =================
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;

  function calcVerticalFovFromValorant(aspect) {
    const hRad = (VAL_HFOV_DEG * Math.PI) / 180;
    const vRad = 2 * Math.atan(Math.tan(hRad / 2) / Math.max(0.5, aspect));
    return (vRad * 180) / Math.PI;
  }

  const camera = new THREE.PerspectiveCamera(70.53, 16 / 9, 0.1, 220);
  camera.rotation.order = 'YXZ';

  function handleResize() {
    const w = Math.max(1, viewportWrap.clientWidth);
    const h = Math.max(1, viewportWrap.clientHeight);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = calcVerticalFovFromValorant(camera.aspect);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', handleResize);
  handleResize();

  // ================= PARTÍCULAS 3D =================
  const fxList = [];
  const sparkGeo = new THREE.BoxGeometry(0.11, 0.11, 0.11);

  function spawnBurst3D(scene, pos, colorHex, count = 12) {
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1 }));
      m.position.copy(pos);
      const vel = new THREE.Vector3((Math.random() - 0.5) * 9, (Math.random() - 0.2) * 8, (Math.random() - 0.5) * 9);
      scene.add(m);
      fxList.push({ mesh: m, scene, vel, life: 0.32 + Math.random() * 0.18, maxLife: 0.5 });
    }
  }

  function updateFx(dt) {
    for (let i = fxList.length - 1; i >= 0; i--) {
      const f = fxList[i];
      f.life -= dt;
      if (f.life <= 0) {
        f.scene.remove(f.mesh);
        if (f.mesh.material) f.mesh.material.dispose();
        fxList.splice(i, 1);
        continue;
      }
      f.vel.y -= 18 * dt;
      f.mesh.position.addScaledVector(f.vel, dt);
      f.mesh.rotation.x += 9 * dt;
      f.mesh.rotation.y += 7 * dt;
      const r = Math.max(0.08, f.life / f.maxLife);
      f.mesh.material.opacity = r;
      f.mesh.scale.setScalar(r);
    }
  }

  function clearFx() {
    while (fxList.length) {
      const f = fxList.pop();
      f.scene.remove(f.mesh);
      if (f.mesh.material) f.mesh.material.dispose();
    }
  }

  // ================= CENA AIMLAB 3D (GRIDSHOT + TRACKER) =================
  const aimlabScene = new THREE.Scene();
  aimlabScene.background = new THREE.Color(cfg.bgColor);
  aimlabScene.fog = new THREE.Fog(cfg.bgColor, 18, 46);

  aimlabScene.add(new THREE.HemisphereLight(0xffffff, 0x162030, 0.85));
  const aimKeyLight = new THREE.DirectionalLight(0xffffff, 1.15);
  aimKeyLight.position.set(6, 12, 8);
  aimKeyLight.castShadow = true;
  aimKeyLight.shadow.mapSize.set(1024, 1024);
  aimlabScene.add(aimKeyLight);
  const aimRimLight = new THREE.PointLight(cfg.targetColor, 1.2, 32);
  aimRimLight.position.set(0, 6, -6);
  aimlabScene.add(aimRimLight);

  let gridWallTex = makeGridTileTexture(cfg.bgColor);
  gridWallTex.repeat.set(4, 2);
  let gridFloorTex = makeGridTileTexture(cfg.bgColor);
  gridFloorTex.repeat.set(5, 5);

  const gridWallMat = new THREE.MeshStandardMaterial({ map: gridWallTex, roughness: 0.78, metalness: 0.08 });
  const gridFloorMat = new THREE.MeshStandardMaterial({ map: gridFloorTex, roughness: 0.65, metalness: 0.14 });

  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(34, 18), gridWallMat);
  backWall.position.set(0, 4.5, -14); backWall.receiveShadow = true; aimlabScene.add(backWall);
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(32, 18), gridWallMat);
  leftWall.rotation.y = Math.PI / 2; leftWall.position.set(-16, 4.5, 0); aimlabScene.add(leftWall);
  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(32, 18), gridWallMat);
  rightWall.rotation.y = -Math.PI / 2; rightWall.position.set(16, 4.5, 0); aimlabScene.add(rightWall);
  const gridFloor = new THREE.Mesh(new THREE.PlaneGeometry(34, 34), gridFloorMat);
  gridFloor.rotation.x = -Math.PI / 2; gridFloor.position.set(0, -1.6, -2); gridFloor.receiveShadow = true; aimlabScene.add(gridFloor);
  const gridCeiling = new THREE.Mesh(new THREE.PlaneGeometry(34, 34), gridWallMat);
  gridCeiling.rotation.x = Math.PI / 2; gridCeiling.position.set(0, 11.5, -2); aimlabScene.add(gridCeiling);

  const frameBorder = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(9.0, 6.8)),
    new THREE.LineBasicMaterial({ color: cfg.targetColor, transparent: true, opacity: 0.45 })
  );
  frameBorder.position.set(0, 2.5, -13.85);
  aimlabScene.add(frameBorder);

  // -------- MODO 1: GRIDSHOT 3D CLÁSSICO (4x4, 3 BOLINHAS) --------
  const GRID_COLS = 4;
  const GRID_ROWS = 4;
  const GRID_SLOTS = [];
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      GRID_SLOTS.push(new THREE.Vector3(
        (c - (GRID_COLS - 1) / 2) * 1.95,
        2.5 + ((GRID_ROWS - 1) / 2 - r) * 1.48,
        -11.5
      ));
    }
  }

  const orbGeo = new THREE.SphereGeometry(0.56, 32, 24);
  const orbMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(cfg.targetColor),
    emissive: new THREE.Color(cfg.targetColor),
    emissiveIntensity: 0.38,
    roughness: 0.22,
    metalness: 0.18
  });

  const activeOrbs = [];
  let aimYaw = 0;
  let aimPitch = 0;

  function clearGridOrbs() {
    while (activeOrbs.length) aimlabScene.remove(activeOrbs.pop().mesh);
  }

  function spawnOneGridOrb(avoidSlot = -1) {
    const used = new Set(activeOrbs.map(o => o.slotIdx));
    const free = [];
    for (let i = 0; i < GRID_SLOTS.length; i++) {
      if (!used.has(i) && i !== avoidSlot) free.push(i);
    }
    if (!free.length) return;
    const slotIdx = free[Math.floor(Math.random() * free.length)];
    const mesh = new THREE.Mesh(orbGeo, orbMat);
    mesh.position.copy(GRID_SLOTS[slotIdx]);
    mesh.castShadow = true;
    mesh.scale.setScalar(0.05);
    aimlabScene.add(mesh);
    activeOrbs.push({ mesh, slotIdx, spawnAt: performance.now(), scale: 0.05 });
  }

  function resetGridshot() {
    clearGridOrbs();
    trackerGroup.visible = false;
    aimYaw = 0;
    aimPitch = 0;
    camera.position.set(0, 2.5, 0);
    camera.rotation.set(0, 0, 0);
    for (let i = 0; i < 3; i++) spawnOneGridOrb();
  }

  // -------- MODO 2: TRACKER 3D (AIMLAB SPHERETRACK) --------
  const trackerGroup = new THREE.Group();
  const trackerOrbMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(cfg.targetColor),
    emissive: new THREE.Color(cfg.targetColor),
    emissiveIntensity: 0.42,
    roughness: 0.18,
    metalness: 0.2
  });
  const trackerMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), trackerOrbMat);
  trackerMesh.castShadow = true;
  trackerGroup.add(trackerMesh);

  const trackerAuraMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(cfg.targetColor),
    transparent: true,
    opacity: 0.32,
    side: THREE.DoubleSide
  });
  const trackerAura = new THREE.Mesh(new THREE.RingGeometry(1.16, 1.32, 32), trackerAuraMat);
  trackerGroup.add(trackerAura);
  trackerGroup.visible = false;
  aimlabScene.add(trackerGroup);

  const tracker = {
    pos: new THREE.Vector3(0, 2.5, -11.2),
    vel: new THREE.Vector3(5, 1.5, 0),
    targetVel: new THREE.Vector3(5, 1.5, 0),
    dirTimer: 0.8,
    onTarget: false,
    tickSoundCooldown: 0
  };

  function pickTrackerVelocity() {
    const d = getDiff();
    const angle = (Math.random() - 0.5) * Math.PI * 0.65;
    const dirX = Math.random() > 0.5 ? 1 : -1;
    const speed = d.trackerSpeed * (0.82 + Math.random() * 0.38);
    tracker.targetVel.set(
      dirX * Math.cos(angle) * speed,
      Math.sin(angle) * speed * 0.65,
      (Math.random() - 0.5) * speed * 0.35
    );
    const [dMin, dMax] = d.trackerDirInterval;
    tracker.dirTimer = dMin + Math.random() * (dMax - dMin);
  }

  function resetTracker() {
    clearGridOrbs();
    const d = getDiff();
    aimYaw = 0;
    aimPitch = 0;
    camera.position.set(0, 2.5, 0);
    camera.rotation.set(0, 0, 0);
    tracker.pos.set(0, 2.5, -11.2);
    tracker.onTarget = false;
    tracker.tickSoundCooldown = 0;
    pickTrackerVelocity();
    tracker.vel.copy(tracker.targetVel);
    trackerGroup.position.copy(tracker.pos);
    trackerGroup.scale.setScalar(d.trackerRadius);
    trackerGroup.visible = true;
    crosshairEl.classList.remove('on-target');
    trackerBadge.classList.remove('locked');
    trackerBadge.textContent = 'MANTENHA A MIRA NA BOLINHA';
  }

  function updateTracker(dt) {
    const d = getDiff();
    tracker.dirTimer -= dt;
    if (tracker.dirTimer <= 0) pickTrackerVelocity();

    tracker.vel.lerp(tracker.targetVel, Math.min(1, dt * 6.5));
    tracker.pos.addScaledVector(tracker.vel, dt);

    if (tracker.pos.x < -5.2) { tracker.pos.x = -5.2; tracker.vel.x = Math.abs(tracker.vel.x); tracker.targetVel.x = Math.abs(tracker.targetVel.x); }
    if (tracker.pos.x > 5.2)  { tracker.pos.x = 5.2;  tracker.vel.x = -Math.abs(tracker.vel.x); tracker.targetVel.x = -Math.abs(tracker.targetVel.x); }
    if (tracker.pos.y < 0.2)  { tracker.pos.y = 0.2;  tracker.vel.y = Math.abs(tracker.vel.y); tracker.targetVel.y = Math.abs(tracker.targetVel.y); }
    if (tracker.pos.y > 5.2)  { tracker.pos.y = 5.2;  tracker.vel.y = -Math.abs(tracker.vel.y); tracker.targetVel.y = -Math.abs(tracker.targetVel.y); }
    if (tracker.pos.z < -12.6){ tracker.pos.z = -12.6; tracker.vel.z = Math.abs(tracker.vel.z); tracker.targetVel.z = Math.abs(tracker.targetVel.z); }
    if (tracker.pos.z > -9.2) { tracker.pos.z = -9.2;  tracker.vel.z = -Math.abs(tracker.vel.z); tracker.targetVel.z = -Math.abs(tracker.targetVel.z); }

    trackerGroup.position.copy(tracker.pos);
    trackerGroup.scale.setScalar(d.trackerRadius);
    trackerAura.lookAt(camera.position);

    camera.position.set(0, 2.5, 0);
    camera.rotation.set(aimPitch, aimYaw, 0, 'YXZ');
    camera.updateMatrixWorld();
    raycaster.setFromCamera(centerNdc, camera);
    const hits = raycaster.intersectObject(trackerMesh, false);
    const isHit = hits.length > 0;

    stats.trackTotalSec += dt;
    if (isHit) {
      stats.trackOnSec += dt;
      stats.trackStreakSec += dt;
      if (stats.trackStreakSec > stats.trackBestStreakSec) stats.trackBestStreakSec = stats.trackStreakSec;
      stats.score += Math.round(dt * 1000 * (1 + Math.min(1.5, stats.trackStreakSec * 0.25)));

      trackerOrbMat.color.set('#4ade80');
      trackerOrbMat.emissive.set('#22c55e');
      trackerOrbMat.emissiveIntensity = 0.72;
      trackerAuraMat.color.set('#4ade80');
      trackerAuraMat.opacity = 0.75;

      tracker.tickSoundCooldown -= dt;
      if (tracker.tickSoundCooldown <= 0) {
        playSound('track-tick');
        tracker.tickSoundCooldown = 0.12;
      }

      if (!tracker.onTarget) {
        tracker.onTarget = true;
        crosshairEl.classList.add('on-target');
        trackerBadge.classList.add('locked');
        trackerBadge.textContent = 'NO ALVO! TRACKING ATIVO';
      }
    } else {
      stats.trackStreakSec = 0;
      trackerOrbMat.color.set(cfg.targetColor);
      trackerOrbMat.emissive.set(cfg.targetColor);
      trackerOrbMat.emissiveIntensity = 0.38;
      trackerAuraMat.color.set(cfg.targetColor);
      trackerAuraMat.opacity = 0.28;

      if (tracker.onTarget) {
        tracker.onTarget = false;
        crosshairEl.classList.remove('on-target');
        trackerBadge.classList.remove('locked');
        trackerBadge.textContent = 'MANTENHA A MIRA NA BOLINHA';
      }
    }
  }

  // ================= CORES DINÂMICAS =================
  function applyVisualColors() {
    aimlabScene.background = new THREE.Color(cfg.bgColor);
    aimlabScene.fog.color.set(cfg.bgColor);
    const oldW = gridWallTex, oldF = gridFloorTex;
    gridWallTex = makeGridTileTexture(cfg.bgColor);
    gridWallTex.repeat.set(4, 2);
    gridFloorTex = makeGridTileTexture(cfg.bgColor);
    gridFloorTex.repeat.set(5, 5);
    gridWallMat.map = gridWallTex; gridWallMat.needsUpdate = true;
    gridFloorMat.map = gridFloorTex; gridFloorMat.needsUpdate = true;
    oldW.dispose(); oldF.dispose();

    orbMat.color.set(cfg.targetColor);
    orbMat.emissive.set(cfg.targetColor);
    aimRimLight.color.set(cfg.targetColor);
    frameBorder.material.color.set(cfg.targetColor);
    if (!tracker.onTarget) {
      trackerOrbMat.color.set(cfg.targetColor);
      trackerOrbMat.emissive.set(cfg.targetColor);
      trackerAuraMat.color.set(cfg.targetColor);
    }
  }

  // ================= POINTER LOCK ULTRA-LISO (RAW INPUT + ANTI-SPIKE) =================
  const raycaster = new THREE.Raycaster();
  const centerNdc = new THREE.Vector2(0, 0);

  let pendingMouseDX = 0;
  let pendingMouseDY = 0;
  let ignoreLockEvents = 0;

  function lockPointerSmooth() {
    try {
      const promise = canvas.requestPointerLock({ unadjustedMovement: true });
      if (promise && typeof promise.catch === 'function') {
        promise.catch(() => { try { canvas.requestPointerLock(); } catch (e) {} });
      }
    } catch (e) {
      try { canvas.requestPointerLock(); } catch (err) {}
    }
  }

  function onMouseDelta(e) {
    if (state !== 'playing' || document.pointerLockElement !== canvas) return;
    if (ignoreLockEvents > 0) { ignoreLockEvents--; return; }
    const dx = e.movementX || 0;
    const dy = e.movementY || 0;
    if (Math.abs(dx) > 260 || Math.abs(dy) > 260) return;
    pendingMouseDX += dx;
    pendingMouseDY += dy;
  }

  if ('onpointerrawupdate' in window) {
    document.addEventListener('pointerrawupdate', onMouseDelta, { passive: true });
  } else {
    document.addEventListener('mousemove', onMouseDelta, { passive: true });
  }

  function applyPendingMouseLook() {
    if (pendingMouseDX === 0 && pendingMouseDY === 0) return;
    const dx = pendingMouseDX;
    const dy = pendingMouseDY;
    pendingMouseDX = 0;
    pendingMouseDY = 0;

    const radPerCount = (VAL_YAW_DEG * cfg.sens) * (Math.PI / 180);
    aimYaw -= dx * radPerCount;
    aimPitch -= dy * radPerCount;
    aimPitch = Math.max(-Math.PI * 0.44, Math.min(Math.PI * 0.44, aimPitch));
    aimYaw = Math.max(-Math.PI * 0.48, Math.min(Math.PI * 0.48, aimYaw));
  }

  document.addEventListener('pointerlockchange', () => {
    pendingMouseDX = 0;
    pendingMouseDY = 0;
    if (document.pointerLockElement === canvas) ignoreLockEvents = 2;
    else if (state === 'playing') pauseGame();
  });

  document.addEventListener('keydown', (e) => {
    if (state === 'playing' && e.code === 'KeyP') { e.preventDefault(); pauseGame(); }
    else if (state === 'paused' && e.code === 'KeyP') { e.preventDefault(); resumeGame(); }
  });

  canvas.addEventListener('mousedown', (e) => {
    if (state !== 'playing') return;
    if (document.pointerLockElement !== canvas) { lockPointerSmooth(); return; }
    if (e.button === 0 && cfg.mode === 'gridshot') {
      applyPendingMouseLook();
      camera.rotation.set(aimPitch, aimYaw, 0, 'YXZ');
      camera.updateMatrixWorld();
      fireGridshot();
    }
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ================= DISPARO GRIDSHOT 3D =================
  function fireGridshot() {
    stats.shots++;
    raycaster.setFromCamera(centerNdc, camera);
    const meshes = activeOrbs.map(o => o.mesh);
    const hits = raycaster.intersectObjects(meshes, false);

    if (hits.length > 0) {
      const hitMesh = hits[0].object;
      const idx = activeOrbs.findIndex(o => o.mesh === hitMesh);
      if (idx !== -1) {
        const orb = activeOrbs[idx];
        const rt = Math.max(45, performance.now() - orb.spawnAt);
        stats.hits++;
        stats.streak++;
        stats.reactionSum += rt;
        stats.reactionCount++;
        stats.score += 100 + Math.min(100, stats.streak * 5);

        playSound('grid-hit');
        flashHitmarker();
        spawnBurst3D(aimlabScene, orb.mesh.position, cfg.targetColor, 12);

        const oldSlot = orb.slotIdx;
        aimlabScene.remove(orb.mesh);
        activeOrbs.splice(idx, 1);
        spawnOneGridOrb(oldSlot);
      }
    } else {
      stats.streak = 0;
      stats.score = Math.max(0, stats.score - 25);
      playSound('miss');
    }
    updateTopHud(true);
  }

  // ================= HUD COM CACHE =================
  function updateTopHud(force = false) {
    const tStr = (cfg.duration === 0 ? elapsedTime : Math.max(0, timeLeft)).toFixed(1) + 's';
    if (force || tStr !== hudCache.time) { hudCache.time = tStr; hudTime.textContent = tStr; }

    let scoreStr, hitsStr, accStr, extraStr;
    if (cfg.mode === 'gridshot') {
      if (force) {
        hudPrimaryLbl.textContent = 'Pontos';
        hudHitsLbl.textContent = 'Acertos';
        hudAccLbl.textContent = 'Precisão';
        hudExtraLbl.textContent = 'Reação';
      }
      scoreStr = String(stats.score);
      hitsStr = String(stats.hits);
      accStr = (stats.shots > 0 ? Math.round((stats.hits / stats.shots) * 100) : 100) + '%';
      extraStr = stats.reactionCount > 0 ? Math.round(stats.reactionSum / stats.reactionCount) + 'ms' : '--';
    } else {
      if (force) {
        hudPrimaryLbl.textContent = 'Pontos';
        hudHitsLbl.textContent = 'No Alvo';
        hudAccLbl.textContent = 'Tracking';
        hudExtraLbl.textContent = 'Seq. Máx';
      }
      const trackPct = stats.trackTotalSec > 0 ? Math.round((stats.trackOnSec / stats.trackTotalSec) * 100) : 0;
      scoreStr = String(stats.score);
      hitsStr = stats.trackOnSec.toFixed(1) + 's';
      accStr = trackPct + '%';
      extraStr = stats.trackBestStreakSec.toFixed(1) + 's';
    }

    if (force || scoreStr !== hudCache.score) { hudCache.score = scoreStr; hudScore.textContent = scoreStr; }
    if (force || hitsStr !== hudCache.hits) { hudCache.hits = hitsStr; hudHits.textContent = hitsStr; }
    if (force || accStr !== hudCache.acc) { hudCache.acc = accStr; hudAcc.textContent = accStr; }
    if (force || extraStr !== hudCache.extra) { hudCache.extra = extraStr; hudExtra.textContent = extraStr; }
  }

  function refreshButtons() {
    btnStart.disabled = (state === 'playing');
    btnStart.textContent = state === 'paused' ? '▶ Retomar' : '▶ Iniciar';
    btnPause.disabled = (state !== 'playing');
    btnStop.disabled = (state === 'idle' || state === 'ended');
    crosshairEl.classList.toggle('visible', state === 'playing');
    trackerBadge.classList.toggle('visible', cfg.mode === 'tracker' && state === 'playing');
    diffField.style.display = (cfg.mode === 'tracker') ? 'inline-flex' : 'none';
  }

  function resetStats() {
    stats.score = 0; stats.hits = 0; stats.shots = 0;
    stats.reactionSum = 0; stats.reactionCount = 0; stats.streak = 0;
    stats.trackOnSec = 0; stats.trackTotalSec = 0;
    stats.trackStreakSec = 0; stats.trackBestStreakSec = 0;
    timeLeft = cfg.duration;
    elapsedTime = 0;
  }

  function startGame() {
    ensureAudio();
    if (state === 'paused') { resumeGame(); return; }
    clearFx();
    resetStats();
    pendingMouseDX = 0; pendingMouseDY = 0;
    if (cfg.mode === 'gridshot') resetGridshot();
    else resetTracker();

    state = 'playing';
    centerOverlay.classList.add('hidden');
    ovStats.style.display = 'none';
    ovStopBtn.style.display = 'none';
    updateTopHud(true);
    refreshButtons();
    lockPointerSmooth();
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    pendingMouseDX = 0; pendingMouseDY = 0;
    if (document.pointerLockElement === canvas) {
      try { document.exitPointerLock(); } catch (e) {}
    }
    ovBadge.textContent = 'TREINO PAUSADO';
    ovTitle.textContent = 'Pausado';
    ovDesc.textContent = 'Ajuste sensibilidade, dificuldade, cores ou tempo acima e clique em Retomar.';
    ovStats.style.display = 'none';
    ovPrimaryBtn.textContent = '▶ RETOMAR';
    ovStopBtn.style.display = 'inline-flex';
    centerOverlay.classList.remove('hidden');
    refreshButtons();
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    pendingMouseDX = 0; pendingMouseDY = 0;
    centerOverlay.classList.add('hidden');
    refreshButtons();
    lockPointerSmooth();
  }

  function stopGame(showSummary = true, customTitle = null) {
    state = 'ended';
    pendingMouseDX = 0; pendingMouseDY = 0;
    crosshairEl.classList.remove('on-target');
    if (document.pointerLockElement === canvas) {
      try { document.exitPointerLock(); } catch (e) {}
    }
    refreshButtons();

    if (showSummary) {
      const acc = stats.shots > 0 ? Math.round((stats.hits / stats.shots) * 100) : 0;
      const avgRt = stats.reactionCount > 0 ? Math.round(stats.reactionSum / stats.reactionCount) + 'ms' : '--';
      ovTitle.textContent = customTitle || 'Treino Finalizado';

      if (cfg.mode === 'gridshot') {
        const kps = elapsedTime > 0 ? (stats.hits / elapsedTime).toFixed(2) : '0.00';
        ovBadge.textContent = 'RESUMO • AIMLAB GRIDSHOT 3D';
        ovDesc.textContent = `Acertos: ${stats.hits} de ${stats.shots} disparos • Ritmo: ${kps} alvos/s`;
        document.getElementById('stLbl1').textContent = 'Pontos';
        document.getElementById('stVal1').textContent = stats.score;
        document.getElementById('stLbl2').textContent = 'Precisão';
        document.getElementById('stVal2').textContent = acc + '%';
        document.getElementById('stLbl3').textContent = 'Reação';
        document.getElementById('stVal3').textContent = avgRt;
      } else {
        const trackPct = stats.trackTotalSec > 0 ? Math.round((stats.trackOnSec / stats.trackTotalSec) * 100) : 0;
        ovBadge.textContent = `RESUMO • TRACKER 3D (${getDiff().label.toUpperCase()})`;
        ovDesc.textContent = `Tempo mantendo a mira no alvo: ${stats.trackOnSec.toFixed(1)}s de ${stats.trackTotalSec.toFixed(1)}s`;
        document.getElementById('stLbl1').textContent = 'Pontos';
        document.getElementById('stVal1').textContent = stats.score;
        document.getElementById('stLbl2').textContent = 'Tracking';
        document.getElementById('stVal2').textContent = trackPct + '%';
        document.getElementById('stLbl3').textContent = 'Maior Seq.';
        document.getElementById('stVal3').textContent = stats.trackBestStreakSec.toFixed(1) + 's';
      }
      ovStats.style.display = 'grid';
      ovPrimaryBtn.textContent = '↻ TREINAR NOVAMENTE';
      ovStopBtn.style.display = 'none';
      centerOverlay.classList.remove('hidden');
    }
  }

  function setMode(newMode) {
    if (document.pointerLockElement === canvas) {
      try { document.exitPointerLock(); } catch (e) {}
    }
    cfg.mode = newMode === 'tracker' ? 'tracker' : 'gridshot';
    localStorage.setItem('aim3d_mode', cfg.mode);
    state = 'idle';
    clearFx();
    resetStats();
    pendingMouseDX = 0; pendingMouseDY = 0;
    crosshairEl.classList.remove('on-target');

    btnModeGridshot.classList.toggle('active', cfg.mode === 'gridshot');
    btnModeTracker.classList.toggle('active', cfg.mode === 'tracker');

    if (cfg.mode === 'gridshot') {
      resetGridshot();
      ovBadge.textContent = 'AIMLAB GRIDSHOT 3D • VALORANT';
      ovTitle.textContent = 'AimLab Gridshot 3D';
      ovDesc.innerHTML = 'Sensibilidade <b>100% Valorant</b> (0.07°/count • FOV 103° • Raw Input). Destrua as 3 bolinhas 3D o mais rápido possível. Use <b>ESC</b> ou <b>P</b> para pausar.';
    } else {
      resetTracker();
      ovBadge.textContent = `AIMLAB TRACKER 3D • ${getDiff().label.toUpperCase()}`;
      ovTitle.textContent = 'AimLab Tracker 3D';
      ovDesc.innerHTML = 'Acompanhe a bolinha 3D em movimento constante com a mira (sensi <b>100% Valorant</b>). Ajuste a <b>Dificuldade</b> acima para aumentar a velocidade e diminuir o alvo!';
    }

    ovStats.style.display = 'none';
    ovPrimaryBtn.textContent = '▶ INICIAR TREINO';
    ovStopBtn.style.display = 'none';
    centerOverlay.classList.remove('hidden');
    updateTopHud(true);
    refreshButtons();
  }

  // ================= EVENTOS DA BARRA SUPERIOR =================
  btnModeGridshot.addEventListener('click', () => setMode('gridshot'));
  btnModeTracker.addEventListener('click', () => setMode('tracker'));
  btnStart.addEventListener('click', startGame);
  ovPrimaryBtn.addEventListener('click', startGame);
  btnPause.addEventListener('click', pauseGame);
  btnStop.addEventListener('click', () => stopGame(true));
  ovStopBtn.addEventListener('click', () => stopGame(true));

  btnFullscreen.addEventListener('click', () => {
    if (!document.fullscreenElement) trainerShell.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.().catch(() => {});
  });

  diffSelect.addEventListener('change', (e) => {
    cfg.diff = e.target.value;
    localStorage.setItem('aim3d_diff', cfg.diff);
    setMode(cfg.mode);
  });

  function updateSens(val) {
    const clean = Math.max(0.05, Math.min(5.0, parseFloat(val) || 0.35));
    cfg.sens = clean;
    localStorage.setItem('aim3d_sens', clean.toFixed(2));
    sensNumber.value = clean.toFixed(2);
    sensSlider.value = Math.min(2.5, clean);
  }
  sensSlider.addEventListener('input', (e) => updateSens(e.target.value));
  sensNumber.addEventListener('change', (e) => updateSens(e.target.value));

  timeSelect.addEventListener('change', (e) => {
    cfg.duration = parseInt(e.target.value, 10);
    localStorage.setItem('aim3d_time', String(cfg.duration));
    if (state === 'idle' || state === 'ended') {
      timeLeft = cfg.duration;
      updateTopHud(true);
    }
  });

  bgColorPicker.addEventListener('input', (e) => {
    cfg.bgColor = e.target.value;
    localStorage.setItem('aim3d_bg', cfg.bgColor);
    applyVisualColors();
  });

  targetColorPicker.addEventListener('input', (e) => {
    cfg.targetColor = e.target.value;
    localStorage.setItem('aim3d_target', cfg.targetColor);
    applyVisualColors();
  });

  // ================= LOOP PRINCIPAL 3D =================
  let lastTs = performance.now();
  let hudTick = 0;

  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, (now - lastTs) / 1000);
    lastTs = now;

    if (state === 'playing') {
      applyPendingMouseLook();

      elapsedTime += dt;
      if (cfg.duration > 0) {
        timeLeft -= dt;
        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTopHud(true);
          stopGame(true, 'TEMPO ESGOTADO!');
          return;
        }
      }

      if (cfg.mode === 'gridshot') {
        camera.position.set(0, 2.5, 0);
        camera.rotation.set(aimPitch, aimYaw, 0, 'YXZ');
        for (const o of activeOrbs) {
          if (o.scale < 1) {
            o.scale = Math.min(1, o.scale + dt * 16);
            o.mesh.scale.setScalar(o.scale);
          }
        }
      } else {
        updateTracker(dt);
      }

      hudTick += dt;
      if (hudTick >= 0.08) {
        hudTick = 0;
        updateTopHud(false);
      }
    } else {
      if (cfg.mode === 'gridshot') {
        for (const o of activeOrbs) {
          if (o.scale < 1) {
            o.scale = Math.min(1, o.scale + dt * 10);
            o.mesh.scale.setScalar(o.scale);
          }
        }
        camera.position.set(0, 2.5, 0);
        camera.rotation.set(aimPitch, aimYaw, 0, 'YXZ');
      } else {
        trackerGroup.position.set(Math.sin(now * 0.0022) * 3.4, 2.5 + Math.cos(now * 0.0018) * 1.0, -11.2);
        trackerAura.lookAt(camera.position);
        camera.position.set(0, 2.5, 0);
        camera.rotation.set(aimPitch, aimYaw, 0, 'YXZ');
      }
    }

    updateFx(dt);
    renderer.render(aimlabScene, camera);
  }

  setMode(cfg.mode);
  applyVisualColors();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
