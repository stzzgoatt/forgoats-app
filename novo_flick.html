<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aim Trainer 3D • Gridshot Valorant &amp; FiveM PvP</title>
<style>
  :root {
    --accent: #00e5ff;
    --bg-ui: #05070b;
    --panel: rgba(10, 14, 22, 0.86);
    --border: rgba(255, 255, 255, 0.1);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000000;
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .trainer-shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* BARRA SUPERIOR DE CONTROLES */
  .top-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 7px 10px;
    background: rgba(6, 9, 14, 0.96);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .mode-tabs {
    display: flex;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 3px;
    gap: 4px;
  }
  .mode-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.3px;
  }
  .mode-btn:hover { color: #fff; }
  .mode-btn.active {
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    color: var(--accent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent);
  }

  .btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-start {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .btn-start:hover { background: var(--accent); filter: brightness(1.1); }
  .btn-pause {
    background: rgba(251, 191, 36, 0.16);
    border-color: rgba(251, 191, 36, 0.45);
    color: #fde047;
  }
  .btn-stop {
    background: rgba(239, 68, 68, 0.16);
    border-color: rgba(239, 68, 68, 0.45);
    color: #f87171;
  }

  .field {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 3px 7px;
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 600;
  }
  .field input[type="number"] {
    width: 50px;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: var(--accent);
    font-weight: 700;
    font-size: 11px;
    border-radius: 5px;
    padding: 2px 4px;
    text-align: center;
    outline: none;
  }
  .field input[type="range"] {
    width: 58px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .field select {
    background: #0d1118;
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    border-radius: 5px;
    padding: 2px 5px;
    outline: none;
    cursor: pointer;
  }
  .field input[type="color"] {
    width: 20px;
    height: 18px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }
  .field input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* VIEWPORT 3D */
  .viewport-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    overflow: hidden;
    background: #000;
  }
  #threeCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }

  /* HUD SUPERIOR NO JOGO */
  .hud-top {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 10;
    pointer-events: none;
  }
  .hud-pill {
    background: rgba(5, 8, 14, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 5px 12px;
    text-align: center;
    min-width: 78px;
  }
  .hud-pill .lbl {
    font-size: 8.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .hud-pill .val {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .hud-pill.accent .val { color: var(--accent); }
  .hud-pill.gold .val { color: #ffd700; }

  /* LEGENDA DE DECISÃO RÁPIDA */
  .decision-legend {
    position: absolute;
    top: 64px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    font-size: 10px;
    font-weight: 700;
    background: rgba(5, 8, 14, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 4px 12px;
    border-radius: 99px;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
  }
  .leg-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* MIRA CENTRAL */
  .crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 24px;
    height: 24px;
    pointer-events: none;
    z-index: 12;
    display: none;
  }
  .crosshair.visible { display: block; }
  .crosshair span {
    position: absolute;
    background: #00ffdd;
    box-shadow: 0 0 2px #000, 0 0 4px rgba(0, 0, 0, 0.9);
  }
  .ch-top    { width: 2px; height: 6px; left: 11px; top: 2px; }
  .ch-bottom { width: 2px; height: 6px; left: 11px; bottom: 2px; }
  .ch-left   { height: 2px; width: 6px; top: 11px; left: 2px; }
  .ch-right  { height: 2px; width: 6px; top: 11px; right: 2px; }
  .ch-dot    { width: 2px; height: 2px; left: 11px; top: 11px; border-radius: 50%; }

  /* HITMARKER */
  .hitmarker {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%) scale(0.7);
    opacity: 0;
    pointer-events: none;
    z-index: 13;
    transition: opacity 0.1s ease, transform 0.1s ease;
  }
  .hitmarker.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.08);
  }
  .hitmarker.headshot svg { stroke: #ffd700; filter: drop-shadow(0 0 6px #ffd700); }
  .hitmarker.penalty svg { stroke: #ff3b5c; filter: drop-shadow(0 0 6px #ff3b5c); }

  /* HUD INFERIOR DO MODO FIVEM (HP, MUNIÇÃO, ROLAMENTO) */
  .fivem-hud {
    position: absolute;
    bottom: 16px;
    left: 18px;
    right: 18px;
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 11;
  }
  .fivem-hud.visible { display: flex; }

  .hp-card {
    background: rgba(5, 8, 14, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 10px 14px;
    width: 268px;
  }
  .hp-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .hp-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .hp-num {
    font-size: 18px;
    font-weight: 900;
    color: #22c55e;
    font-variant-numeric: tabular-nums;
  }
  .hp-bar-bg {
    width: 100%;
    height: 10px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .hp-bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #16a34a, #4ade80);
    border-radius: 99px;
    transition: width 0.14s ease, background 0.2s ease;
  }
  .fivem-keys {
    margin-top: 7px;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.65);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .fivem-keys b { color: var(--accent); }

  .ammo-card {
    background: rgba(5, 8, 14, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 10px 16px;
    text-align: right;
    min-width: 155px;
  }
  .ammo-main {
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .ammo-main small { font-size: 12px; color: var(--muted); font-weight: 700; }
  .ammo-sub {
    margin-top: 4px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  /* FEEDBACK FLUTUANTE */
  .feed-toast {
    position: absolute;
    top: 96px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .feed-item {
    font-size: 12.5px;
    font-weight: 900;
    letter-spacing: 0.7px;
    padding: 4px 12px;
    border-radius: 99px;
    background: rgba(0, 0, 0, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.18);
    animation: popFade 0.85s ease forwards;
  }
  @keyframes popFade {
    0%   { opacity: 0; transform: translateY(8px) scale(0.92); }
    15%  { opacity: 1; transform: translateY(0) scale(1); }
    80%  { opacity: 1; transform: translateY(-6px); }
    100% { opacity: 0; transform: translateY(-16px); }
  }

  /* FLASH DE DANO / CURA */
  .screen-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  /* OVERLAY CENTRAL */
  .center-overlay {
    position: absolute;
    inset: 0;
    z-index: 16;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(2, 4, 8, 0.74);
    backdrop-filter: blur(6px);
  }
  .center-overlay.hidden { display: none; }

  .overlay-card {
    width: 92%;
    max-width: 510px;
    background: rgba(10, 14, 22, 0.95);
    border: 1px solid color-mix(in srgb, var(--accent) 42%, rgba(255, 255, 255, 0.12));
    border-radius: 16px;
    padding: 24px 26px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
  }
  .overlay-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    padding: 4px 10px;
    border-radius: 99px;
    margin-bottom: 10px;
  }
  .overlay-title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 6px; }
  .overlay-desc { font-size: 12.5px; color: var(--muted); line-height: 1.48; margin-bottom: 16px; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .stat-box {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 9px 5px;
  }
  .stat-box .k { font-size: 9px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .stat-box .v { font-size: 17px; font-weight: 900; color: var(--accent); margin-top: 3px; }
  .overlay-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="trainer-shell" id="trainerShell">
  <!-- BARRA SUPERIOR -->
  <div class="top-controls">
    <div class="ctrl-group">
      <div class="mode-tabs">
        <button class="mode-btn active" id="btnModeGridshot">Gridshot 3D (Valorant)</button>
        <button class="mode-btn" id="btnModeFivem">Treino FiveM 3ª Pessoa</button>
      </div>
      <button class="btn btn-start" id="btnStart">▶ Iniciar</button>
      <button class="btn btn-pause" id="btnPause" disabled>⏸ Pausar</button>
      <button class="btn btn-stop" id="btnStop" disabled>■ Parar</button>
      <button class="btn" id="btnFullscreen" title="Tela Cheia">⛶</button>
    </div>

    <div class="ctrl-group">
      <label class="field" title="Dificuldade (velocidade, tamanho dos alvos, agressividade e janela de reação)">
        Nível
        <select id="diffSelect">
          <option value="normal">Normal</option>
          <option value="hard" selected>Difícil</option>
          <option value="insane">Pro / Insano</option>
        </select>
      </label>

      <label class="field" title="Ativa alvos prioritários (dourado) e iscas/aliados proibidos para treinar tomada de decisão em milissegundos">
        <input type="checkbox" id="decisionToggle" checked>
        Decisão Rápida
      </label>

      <label class="field" title="Sensibilidade 100% Valorant (0.07° por count, FOV 103°, raw input)">
        Sensi
        <input type="range" id="sensSlider" min="0.05" max="2.50" step="0.01" value="0.35">
        <input type="number" id="sensNumber" min="0.05" max="5.00" step="0.01" value="0.35">
      </label>

      <label class="field">
        Tempo
        <select id="timeSelect">
          <option value="30">30s</option>
          <option value="60" selected>60s</option>
          <option value="90">90s</option>
          <option value="120">120s</option>
          <option value="0">Livre</option>
        </select>
      </label>

      <label class="field" title="Cor do fundo da arena / céu">
        Fundo
        <input type="color" id="bgColorPicker" value="#0a101b">
      </label>

      <label class="field" title="Cor das bolinhas (Gridshot) ou alvos/colete inimigo (FiveM)">
        Alvos
        <input type="color" id="targetColorPicker" value="#00e5ff">
      </label>
    </div>
  </div>

  <!-- VIEWPORT 3D -->
  <div class="viewport-wrap" id="viewportWrap">
    <canvas id="threeCanvas"></canvas>
    <div class="screen-vignette" id="screenVignette"></div>

    <!-- HUD SUPERIOR -->
    <div class="hud-top">
      <div class="hud-pill accent">
        <div class="lbl">Tempo</div>
        <div class="val" id="hudTime">60.0s</div>
      </div>
      <div class="hud-pill">
        <div class="lbl" id="hudPrimaryLbl">Pontos</div>
        <div class="val" id="hudScore">0</div>
      </div>
      <div class="hud-pill">
        <div class="lbl" id="hudHitsLbl">Acertos</div>
        <div class="val" id="hudHits">0</div>
      </div>
      <div class="hud-pill">
        <div class="lbl">Precisão</div>
        <div class="val" id="hudAcc">100%</div>
      </div>
      <div class="hud-pill gold">
        <div class="lbl" id="hudExtraLbl">Reação</div>
        <div class="val" id="hudExtra">--</div>
      </div>
    </div>

    <!-- LEGENDA DE DECISÃO RÁPIDA -->
    <div class="decision-legend" id="decisionLegend"></div>

    <!-- MIRA CENTRAL -->
    <div class="crosshair" id="crosshair">
      <span class="ch-top"></span>
      <span class="ch-bottom"></span>
      <span class="ch-left"></span>
      <span class="ch-right"></span>
      <span class="ch-dot"></span>
    </div>

    <!-- HITMARKER -->
    <div class="hitmarker" id="hitmarker">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
        <line x1="4" y1="4" x2="9" y2="9"/>
        <line x1="20" y1="4" x2="15" y2="9"/>
        <line x1="4" y1="20" x2="9" y2="15"/>
        <line x1="20" y1="20" x2="15" y2="15"/>
      </svg>
    </div>

    <!-- FEEDBACK FLUTUANTE -->
    <div class="feed-toast" id="feedToast"></div>

    <!-- HUD INFERIOR DO MODO FIVEM -->
    <div class="fivem-hud" id="fivemHud">
      <div class="hp-card">
        <div class="hp-header">
          <span class="hp-label">Vida (Kill = +25 HP | Líder = +40 HP)</span>
          <span class="hp-num" id="hudHpVal">100</span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill" id="hudHpBar"></div>
        </div>
        <div class="fivem-keys">
          <span><b>WASD</b> Mover</span>
          <span><b>SHIFT/Q</b> Rolar</span>
          <span><b>ESPAÇO</b> Pular</span>
          <span><b>RMB</b> Mirar</span>
          <span><b>R</b> Recarregar</span>
        </div>
      </div>

      <div class="ammo-card">
        <div class="ammo-main" id="hudAmmo">30 <small>/ ∞</small></div>
        <div class="ammo-sub" id="hudRollStatus">ROLAMENTO PRONTO</div>
      </div>
    </div>

    <!-- OVERLAY CENTRAL -->
    <div class="center-overlay" id="centerOverlay">
      <div class="overlay-card">
        <div class="overlay-badge" id="ovBadge">AIMLAB GRIDSHOT 3D • REAÇÃO &amp; DECISÃO</div>
        <div class="overlay-title" id="ovTitle">Pronto para Treinar</div>
        <div class="overlay-desc" id="ovDesc"></div>
        <div class="stats-grid" id="ovStats" style="display: none;">
          <div class="stat-box"><div class="k" id="stLbl1">Pontos</div><div class="v" id="stVal1">0</div></div>
          <div class="stat-box"><div class="k" id="stLbl2">Precisão</div><div class="v" id="stVal2">0%</div></div>
          <div class="stat-box"><div class="k" id="stLbl3">Reação Méd.</div><div class="v" id="stVal3">--</div></div>
          <div class="stat-box"><div class="k" id="stLbl4">Melhor MS</div><div class="v" id="stVal4">--</div></div>
        </div>
        <div class="overlay-actions">
          <button class="btn btn-start" id="ovPrimaryBtn" style="padding: 10px 26px; font-size: 13px;">▶ INICIAR TREINO</button>
          <button class="btn btn-stop" id="ovStopBtn" style="display: none; padding: 10px 18px; font-size: 13px;">■ Encerrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  if (typeof THREE === 'undefined') {
    document.getElementById('ovTitle').textContent = 'Erro ao carregar motor 3D';
    return;
  }

  // ================= PARÂMETROS DE DIFICULDADE (FOCO EM REAÇÃO E DECISÃO) =================
  const DIFF_PROFILES = {
    normal: {
      label: 'Normal',
      orbRadius: 0.50,
      orbLifeMs: 1750,
      priorityLifeMs: 1150,
      decoyChance: 0.16,
      priorityChance: 0.18,
      enemyCount: 3,
      enemySpeed: 4.8,
      enemyRollInterval: [2.2, 3.6],
      enemyFireInterval: [0.85, 1.45],
      enemyBaseHitChance: 0.48,
      enemyDamage: [8, 12],
      enemyHp: 100
    },
    hard: {
      label: 'Difícil',
      orbRadius: 0.40,
      orbLifeMs: 1150,
      priorityLifeMs: 780,
      decoyChance: 0.22,
      priorityChance: 0.24,
      enemyCount: 4,
      enemySpeed: 6.1,
      enemyRollInterval: [1.3, 2.4],
      enemyFireInterval: [0.58, 1.05],
      enemyBaseHitChance: 0.62,
      enemyDamage: [11, 16],
      enemyHp: 105
    },
    insane: {
      label: 'Pro / Insano',
      orbRadius: 0.31,
      orbLifeMs: 820,
      priorityLifeMs: 580,
      decoyChance: 0.28,
      priorityChance: 0.28,
      enemyCount: 5,
      enemySpeed: 7.4,
      enemyRollInterval: [0.85, 1.65],
      enemyFireInterval: [0.40, 0.78],
      enemyBaseHitChance: 0.74,
      enemyDamage: [14, 20],
      enemyHp: 110
    }
  };

  // ================= ESTADO & CONFIGURAÇÕES =================
  const VAL_YAW_DEG = 0.07;  // Exato do Valorant: 0.07° por mouse count
  const VAL_HFOV_DEG = 103;  // FOV horizontal oficial do Valorant

  const cfg = {
    mode: localStorage.getItem('aim3d_mode') || 'gridshot',
    diff: localStorage.getItem('aim3d_diff') || 'hard',
    decision: localStorage.getItem('aim3d_decision') !== 'false',

  // ================= ÁUDIO SINTÉTICO OFFLINE =================
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }

  function playSound(type) {
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'grid-hit') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(720, now);
      osc.frequency.exponentialRampToValueAtTime(1260, now + 0.05);
      gain.gain.setValueAtTime(0.17, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
      osc.start(now); osc.stop(now + 0.07);
    } else if (type === 'priority-hit') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1040, now);
      osc.frequency.exponentialRampToValueAtTime(1840, now + 0.08);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.11);
    } else if (type === 'penalty') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.linearRampToValueAtTime(75, now + 0.16);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      osc.start(now); osc.stop(now + 0.18);
    } else if (type === 'miss') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.055);
      gain.gain.setValueAtTime(0.07, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now); osc.stop(now + 0.065);
    } else if (type === 'rifle') {
      const bufSize = Math.floor(audioCtx.sampleRate * 0.05);
      const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.22));
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1250;
      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.16, now);
      nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      noise.connect(filter); filter.connect(nGain); nGain.connect(audioCtx.destination);
      noise.start(now);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(185, now);
      osc.frequency.exponentialRampToValueAtTime(52, now + 0.05);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
      osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'enemy-shot') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(75, now + 0.04);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'headshot') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1320, now);
      osc.frequency.exponentialRampToValueAtTime(1980, now + 0.085);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.11);
    } else if (type === 'kill') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.setValueAtTime(780, now + 0.045);
      osc.frequency.setValueAtTime(1060, now + 0.09);
      gain.gain.setValueAtTime(0.19, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.start(now); osc.stop(now + 0.17);
    } else if (type === 'hurt') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(130, now);
      osc.frequency.exponentialRampToValueAtTime(58, now + 0.09);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.11);
    }
  }

  // ================= GERADOR DE TEXTURAS PROCEDURAIS 3D =================
  function makeGridTileTexture(baseHex) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    const col = new THREE.Color(baseHex);
    ctx.fillStyle = `rgb(${Math.round(col.r * 255)},${Math.round(col.g * 255)},${Math.round(col.b * 255)})`;
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 6000; i++) {
      const a = Math.random() * 0.045;
      ctx.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.4})`;
      ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for (let i = 0; i <= 512; i += 128) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }

  function makeAsphaltTexture() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 1024;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#24272d';
    ctx.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 42000; i++) {
      const v = 24 + Math.floor(Math.random() * 44);
      ctx.fillStyle = `rgb(${v},${v + 1},${v + 4})`;
      ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
    }
    for (let i = 0; i < 20; i++) {
      const gx = Math.random() * 1024, gy = Math.random() * 1024, gr = 30 + Math.random() * 85;
      const grad = ctx.createRadialGradient(gx, gy, 4, gx, gy, gr);
      grad.addColorStop(0, 'rgba(10,12,16,0.22)');
      grad.addColorStop(1, 'rgba(10,12,16,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(225, 178, 42, 0.72)';
    ctx.fillRect(496, 0, 10, 1024);
    ctx.fillRect(516, 0, 10, 1024);
    ctx.fillStyle = 'rgba(220, 226, 232, 0.45)';

    tex.anisotropy = 4;

    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1 }));

  function spawnTracer3D(scene, start, end, colorHex = 0xfff0a8) {
    const geom = new THREE.BufferGeometry().setFromPoints([start, end]);
    const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.92 });
    const line = new THREE.Line(geom, mat);
    scene.add(line);
    fxList.push({ type: 'tracer', mesh: line, scene, life: 0.075, maxLife: 0.075 });
  }

  function updateFx(dt) {
    for (let i = fxList.length - 1; i >= 0; i--) {
      const f = fxList[i];
      f.life -= dt;
      if (f.life <= 0) {
        f.scene.remove(f.mesh);
        if (f.mesh.geometry && f.mesh.geometry !== sparkGeo) f.mesh.geometry.dispose();
        if (f.mesh.material) f.mesh.material.dispose();
        fxList.splice(i, 1);
        continue;
      }
      if (f.type === 'spark') {
        f.vel.y -= 18 * dt;
        f.mesh.position.addScaledVector(f.vel, dt);
        f.mesh.rotation.x += 9 * dt;
        f.mesh.rotation.y += 7 * dt;
        const r = Math.max(0.08, f.life / f.maxLife);
        f.mesh.material.opacity = r;
        f.mesh.scale.setScalar(r);
      } else if (f.type === 'tracer') {
        f.mesh.material.opacity = Math.max(0, f.life / f.maxLife);
      }
    }
  }

  function clearGridOrbs() {
    while (activeOrbs.length) {
      const o = activeOrbs.pop();
      gridScene.remove(o.group);
      o.ring.material.dispose();
    }
  }

  function spawnOneGridOrb(avoidSlot = -1) {
    const used = new Set(activeOrbs.map(o => o.slotIdx));
    const free = [];
    for (let i = 0; i < GRID_SLOTS.length; i++) {
      if (!used.has(i) && i !== avoidSlot) free.push(i);
    }
    if (!free.length) return;

    const d = getDiff();
    const shootableCount = activeOrbs.filter(o => o.kind !== 'decoy').length;
    const decoyCount = activeOrbs.filter(o => o.kind === 'decoy').length;

    let kind = 'normal';
    if (cfg.decision) {
      const roll = Math.random();
      if (shootableCount >= 2 && decoyCount < 1 && roll < d.decoyChance) {
        kind = 'decoy';
      } else if (roll < d.decoyChance + d.priorityChance) {
        kind = 'priority';
      }
    }

    const slotIdx = free[Math.floor(Math.random() * free.length)];
    const radius = kind === 'priority' ? d.orbRadius * 0.86 : d.orbRadius;
    const lifeMs = kind === 'priority' ? d.priorityLifeMs : (kind === 'decoy' ? 1400 : d.orbLifeMs);

    const group = new THREE.Group();
    group.position.copy(GRID_SLOTS[slotIdx]);

    const mat = kind === 'priority' ? orbMatPriority : (kind === 'decoy' ? orbMatDecoy : orbMatNormal);
    const mesh = new THREE.Mesh(orbUnitGeo, mat);
    mesh.castShadow = true;
    group.add(mesh);

    const ringColor = kind === 'priority' ? 0xffd700 : (kind === 'decoy' ? 0xff2442 : new THREE.Color(cfg.targetColor));
    const ring = new THREE.Mesh(
      ringUnitGeo,
      new THREE.MeshBasicMaterial({ color: ringColor, transparent: true, opacity: 0.78, side: THREE.DoubleSide })
    );
    group.add(ring);

    // X branco em cima da isca vermelha para identificação em milissegundos
    if (kind === 'decoy') {
      const xMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const b1 = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.22, 0.12), xMat);
      b1.position.z = 0.96; b1.rotation.z = Math.PI / 4;
      const b2 = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.22, 0.12), xMat);
      b2.position.z = 0.96; b2.rotation.z = -Math.PI / 4;
      group.add(b1, b2);
    }

    group.scale.setScalar(0.05);
    gridScene.add(group);

    const orb = { group, mesh, ring, kind, slotIdx, spawnAt: performance.now(), lifeMs, radius, pop: 0.05 };
    mesh.userData.orb = orb;
    activeOrbs.push(orb);
  }

  function updateGridOrbs(dt, now) {
    for (let i = activeOrbs.length - 1; i >= 0; i--) {
      const o = activeOrbs[i];
      const age = now - o.spawnAt;

      if (age >= o.lifeMs) {
        // Alvo expirou!
        if (o.kind !== 'decoy') {
          stats.expiredTargets++;
          stats.streak = 0;
          stats.score = Math.max(0, stats.score - 40);
          showFeed(o.kind === 'priority' ? 'PRIORIDADE PERDIDA!' : 'LENTO DEMAIS!', '#f97316');
        }
        const oldSlot = o.slotIdx;
        gridScene.remove(o.group);
        o.ring.material.dispose();
        activeOrbs.splice(i, 1);
        spawnOneGridOrb(oldSlot);
        continue;
      }

      if (o.pop < 1) o.pop = Math.min(1, o.pop + dt * 16);
      const lifeRatio = Math.max(0.15, 1 - age / o.lifeMs);
      const pulse = o.kind === 'priority' ? (1 + Math.sin(now * 0.024) * 0.08) : 1;
      o.group.scale.setScalar(o.radius * o.pop * pulse);
      o.ring.scale.setScalar(0.85 + lifeRatio * 0.65);
      o.ring.material.opacity = 0.25 + lifeRatio * 0.65;
      o.ring.lookAt(camera.position);
    }
  }

  function resolveArenaCollision(pos, radius = 0.48) {
    pos.x = Math.max(-ARENA_HALF + radius, Math.min(ARENA_HALF - radius, pos.x));
    pos.z = Math.max(-ARENA_HALF + radius, Math.min(ARENA_HALF - radius, pos.z));
    for (const ob of fmObstacles) {
      if (pos.y > ob.maxY) continue;
      const cx = Math.max(ob.minX, Math.min(pos.x, ob.maxX));
      const cz = Math.max(ob.minZ, Math.min(pos.z, ob.maxZ));
      const dx = pos.x - cx, dz = pos.z - cz;
      const dSq = dx * dx + dz * dz;
      if (dSq < radius * radius) {
        const dist = Math.sqrt(dSq) || 0.0001;
        const push = radius - dist;
        pos.x += (dx / dist) * push;
        pos.z += (dz / dist) * push;
      }
    }
  }

  function spawnEnemy(forcedRole = null) {
    const d = getDiff();
    const candidates = SPAWN_POINTS.filter(sp =>
      sp.distanceTo(player.pos) > 11 && enemies.every(e => e.pos.distanceTo(sp) > 4.2)
    );
    const pick = (candidates.length ? candidates : SPAWN_POINTS)[Math.floor(Math.random() * (candidates.length || SPAWN_POINTS.length))];

    let role = forcedRole || 'enemy';
    if (!forcedRole && cfg.decision) {
      const hasLeader = enemies.some(e => e.role === 'leader');
      const hasAlly = enemies.some(e => e.role === 'ally');
      const r = Math.random();
      if (!hasLeader && r < 0.28) role = 'leader';
      else if (!hasAlly && enemies.length >= 2 && r < 0.42) role = 'ally';
    }

    const rig = createCharacterRig({ role, accentHex: cfg.targetColor });
    const hpBar = createEnemyHpBar(role);
    rig.root.add(hpBar.grp);
    rig.root.position.copy(pick);
    fivemScene.add(rig.root);

    const maxHp = role === 'leader' ? d.enemyHp + 20 : d.enemyHp;
    const [rMin, rMax] = d.enemyRollInterval;
    const [fMin, fMax] = d.enemyFireInterval;

    const enemy = {
      rig, hpBar, role,
      pos: pick.clone(),
      hp: maxHp,
      maxHp,
      firstSeenAt: null,
      firstHitLogged: false,
      strafeDir: Math.random() > 0.5 ? 1 : -1,

    rig.hitMeshes.forEach(m => { m.userData.enemy = enemy; });

    if (cfg.mode === 'gridshot') {
      decisionLegend.innerHTML =
        `<span><i class="leg-dot" style="background:${cfg.targetColor}"></i>Alvo Normal</span>` +
        `<span style="color:#ffd700;"><i class="leg-dot" style="background:#ffd700"></i>Prioridade (3x • Rápido!)</span>` +
        `<span style="color:#ff4d6d;"><i class="leg-dot" style="background:#ff2442"></i>Isca X (NÃO ATIRE!)</span>`;
    } else {
      decisionLegend.innerHTML =
        `<span><i class="leg-dot" style="background:${cfg.targetColor}"></i>Inimigo (+25 HP)</span>` +
        `<span style="color:#ffd700;"><i class="leg-dot" style="background:#ffd700"></i>Líder Prioritário (+40 HP)</span>` +
        `<span style="color:#4ade80;"><i class="leg-dot" style="background:#22c55e"></i>Aliado (NÃO ATIRE!)</span>`;
    }
  }

  // ================= POINTER LOCK ULTRA-LISO (CORREÇÃO DOS CORTES DA CÂMERA!) =================
  const keys = {};
  const raycaster = new THREE.Raycaster();
  const centerNdc = new THREE.Vector2(0, 0);

  // Acumuladores de delta por frame + filtro anti-spike do Chromium Pointer Lock
  let pendingMouseDX = 0;
  let pendingMouseDY = 0;
  let ignoreLockEvents = 0;

  function lockPointerSmooth() {
    try {
      const promise = canvas.requestPointerLock({ unadjustedMovement: true });
      if (promise && typeof promise.catch === 'function') {
        promise.catch(() => {
          try { canvas.requestPointerLock(); } catch (e) {}
        });
      }
    } catch (e) {
      try { canvas.requestPointerLock(); } catch (err) {}
    }
  }

  function onMouseDelta(e) {
    if (state !== 'playing' || document.pointerLockElement !== canvas) return;
    // Ignora os 2 primeiros eventos logo após travar o mouse (evita salto de recentralização do Chromium)
    if (ignoreLockEvents > 0) {
      ignoreLockEvents--;
      return;
    }
    const dx = e.movementX || 0;
    const dy = e.movementY || 0;
    // Rejeita spikes falsos do Windows/Chromium Pointer Lock (> 260px num único pacote)
    if (Math.abs(dx) > 260 || Math.abs(dy) > 260) return;
    pendingMouseDX += dx;
    pendingMouseDY += dy;
  }

  // Usa pointerrawupdate se disponível (menor latência e sem cortes), senão mousemove
  if ('onpointerrawupdate' in window) {
    document.addEventListener('pointerrawupdate', onMouseDelta, { passive: true });
  } else {
    document.addEventListener('mousemove', onMouseDelta, { passive: true });
  }

  function applyPendingMouseLook() {
    if (pendingMouseDX === 0 && pendingMouseDY === 0) return;
    const dx = pendingMouseDX;
    const dy = pendingMouseDY;
    pendingMouseDX = 0;
    pendingMouseDY = 0;

    const adsMult = (cfg.mode === 'fivem' && player.ads) ? 0.72 : 1.0;
    const radPerCount = (VAL_YAW_DEG * cfg.sens * adsMult) * (Math.PI / 180);

    if (cfg.mode === 'gridshot') {
      gridYaw -= dx * radPerCount;
      gridPitch -= dy * radPerCount;
      gridPitch = Math.max(-Math.PI * 0.44, Math.min(Math.PI * 0.44, gridPitch));
      gridYaw = Math.max(-Math.PI * 0.48, Math.min(Math.PI * 0.48, gridYaw));
    } else {
      player.yaw -= dx * radPerCount;
      player.pitch -= dy * radPerCount;
      player.pitch = Math.max(-0.68, Math.min(0.62, player.pitch));
    }
  }

  document.addEventListener('pointerlockchange', () => {
    pendingMouseDX = 0;
    pendingMouseDY = 0;
    if (document.pointerLockElement === canvas) {
      ignoreLockEvents = 2;
    } else if (state === 'playing') {
      pauseGame();
    }
  });

  document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (state === 'playing') {
      if (e.code === 'KeyP') {
        e.preventDefault();
        pauseGame();
      } else if (cfg.mode === 'fivem') {
        if (e.code === 'KeyR' && !player.reloading && player.ammo < player.maxAmmo) startReload();
        else if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyQ' || e.code === 'KeyC') && !player.rolling && player.rollCooldown <= 0) triggerPlayerRoll();
        else if (e.code === 'Space' && player.onGround) {
          e.preventDefault();
          player.vel.y = 7.6;
          player.onGround = false;
        }
      }
    } else if (state === 'paused' && e.code === 'KeyP') {
      e.preventDefault();
      resumeGame();
    }
  });

  document.addEventListener('keyup', (e) => { keys[e.code] = false; });

  canvas.addEventListener('mousedown', (e) => {
    if (state !== 'playing') return;
    if (document.pointerLockElement !== canvas) {
      lockPointerSmooth();
      return;
    }
    if (e.button === 0) {
      // Aplica qualquer micro-movimento pendente antes do raycast do tiro (latência zero!)
      applyPendingMouseLook();
      if (cfg.mode === 'gridshot') {
        camera.rotation.set(gridPitch, gridYaw, 0, 'YXZ');
        camera.updateMatrixWorld();
        fireGridshot();
      } else {
        player.firing = true;
        fireFivemWeapon();
      }
    } else if (e.button === 2 && cfg.mode === 'fivem') {
      player.ads = true;
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) player.firing = false;
    if (e.button === 2) player.ads = false;
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ================= DISPAROS GRIDSHOT 3D =================
  function fireGridshot() {
    stats.shots++;
    raycaster.setFromCamera(centerNdc, camera);
    const meshes = activeOrbs.map(o => o.mesh);
    const hits = raycaster.intersectObjects(meshes, false);

    if (hits.length > 0) {
      const orb = hits[0].object.userData.orb;
      const idx = activeOrbs.indexOf(orb);
      if (idx !== -1) {
        if (orb.kind === 'decoy') {
          // Acertou a isca proibida!
          stats.decoyMistakes++;
          stats.streak = 0;
          stats.score = Math.max(0, stats.score - 200);
          playSound('penalty');
          flashHitmarker('penalty');
          flashVignette('rgba(239, 68, 68, 0.36)');
          showFeed('ISCA! -200 PTS', '#ff4d6d');
          spawnBurst3D(gridScene, orb.group.position, 0xff2442, 14);
        } else {
          const rt = Math.max(45, performance.now() - orb.spawnAt);
          stats.hits++;
          stats.streak++;
          stats.reactionSum += rt;
          stats.reactionCount++;
          if (rt < stats.bestReaction) stats.bestReaction = rt;

          const speedBonus = rt < 300 ? 120 : (rt < 450 ? 60 : 20);
          if (orb.kind === 'priority') {
            stats.priorityHits++;
            stats.score += 300 + speedBonus + Math.min(150, stats.streak * 10);
            playSound('priority-hit');
            flashHitmarker('headshot');
            showFeed(`PRIORIDADE! ${Math.round(rt)}ms`, '#ffd700');
            spawnBurst3D(gridScene, orb.group.position, 0xffd700, 16);
          } else {
            stats.score += 100 + speedBonus + Math.min(100, stats.streak * 6);
            playSound('grid-hit');
            flashHitmarker('normal');
            spawnBurst3D(gridScene, orb.group.position, cfg.targetColor, 12);
          }
        }

        const oldSlot = orb.slotIdx;
        gridScene.remove(orb.group);
        orb.ring.material.dispose();
        activeOrbs.splice(idx, 1);
        spawnOneGridOrb(oldSlot);
      }
    } else {
      stats.streak = 0;
      stats.score = Math.max(0, stats.score - 35);
      playSound('miss');
    }
    updateTopHud(true);
  }

  // ================= AÇÕES FIVEM 3ª PESSOA =================
  function startReload() {
    player.reloading = true;
    player.reloadTimer = 1.05;
    updateFivemHud(true);
  }

  function triggerPlayerRoll() {
    player.rolling = true;
    player.rollTimer = player.rollDuration;
    player.rollCooldown = 1.05;

    _vFwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    _vRight.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    _vMove.set(0, 0, 0);
    if (keys['KeyW']) _vMove.add(_vFwd);
    if (keys['KeyS']) _vMove.sub(_vFwd);
    if (keys['KeyD']) _vMove.add(_vRight);
    if (keys['KeyA']) _vMove.sub(_vRight);
    if (_vMove.lengthSq() < 0.01) _vMove.copy(_vRight);
    player.rollDir.copy(_vMove.normalize());
    updateFivemHud(true);
  }

  function fireFivemWeapon() {
    if (player.fireCooldown > 0 || player.reloading || player.rolling) return;
    if (player.ammo <= 0) { startReload(); return; }

    player.ammo--;
    player.fireCooldown = 0.11;
    player.muzzleTimer = 0.045;
    playerRig.muzzleFlash.material.opacity = 1;
    player.pitch = Math.min(0.62, player.pitch + 0.0042);
    stats.shots++;
    playSound('rifle');

    raycaster.setFromCamera(centerNdc, camera);
    const enemyMeshes = [];
    for (let i = 0; i < enemies.length; i++) enemyMeshes.push(...enemies[i].rig.hitMeshes);
    const hits = raycaster.intersectObjects([...enemyMeshes, ...fmObstacleMeshes], false);

    const muzzleWorld = new THREE.Vector3();
    playerRig.muzzlePoint.getWorldPosition(muzzleWorld);
    const endPoint = raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, 95);

    if (hits.length > 0) {
      const first = hits[0];
      endPoint.copy(first.point);

      if (first.object.userData && first.object.userData.enemy) {
        const enemy = first.object.userData.enemy;
        const isHead = first.object.userData.part === 'head';

        if (enemy.role === 'ally') {
          // Acertou aliado! Penalidade de decisão rápida
          stats.decoyMistakes++;
          stats.score = Math.max(0, stats.score - 200);
          player.hp = Math.max(1, player.hp - 10);
          playSound('penalty');
          flashHitmarker('penalty');
          flashVignette('rgba(239, 68, 68, 0.35)');
          showFeed('FOGO AMIGO! -10 HP', '#ff4d6d');
          spawnBurst3D(fivemScene, first.point, 0x4ade80, 10);
        } else {
          if (!enemy.firstHitLogged && enemy.firstSeenAt) {
            const rt = Math.max(60, performance.now() - enemy.firstSeenAt);
            stats.reactionSum += rt;
            stats.reactionCount++;
            if (rt < stats.bestReaction) stats.bestReaction = rt;
            enemy.firstHitLogged = true;
          }

          const dmg = isHead ? 78 : 34;
          stats.hits++;
          stats.damageDealt += dmg;
          enemy.hp -= dmg;

          flashHitmarker(isHead ? 'headshot' : 'normal');
          spawnBurst3D(fivemScene, first.point, isHead ? 0xffd700 : 0xff4d6d, isHead ? 14 : 8);

          if (isHead) {
            playSound('headshot');
            showFeed('HEADSHOT! -78', '#ffd700');
          }

          if (enemy.hp <= 0) {
            stats.kills++;
            if (isHead) stats.headshots++;
            const isLeader = enemy.role === 'leader';
            if (isLeader) stats.priorityHits++;
            const healAmount = isLeader ? 40 : 25;
            stats.score += (isLeader ? 320 : 160) + (isHead ? 100 : 0);

            const healed = Math.min(player.maxHp - player.hp, healAmount);
            player.hp = Math.min(player.maxHp, player.hp + healAmount);

            playSound('kill');
            flashVignette('rgba(34, 197, 94, 0.32)');
            showFeed(
              isLeader
                ? `LÍDER ABATIDO! +${healed} HP`
                : (healed > 0 ? `ELIMINADO! +${healed} HP` : 'ELIMINADO! (HP CHEIO)'),
              isLeader ? '#ffd700' : '#4ade80'
            );
            spawnBurst3D(fivemScene, enemy.pos.clone().add(new THREE.Vector3(0, 1.1, 0)), isLeader ? 0xffd700 : cfg.targetColor, 18);

            fivemScene.remove(enemy.rig.root);
            const eIdx = enemies.indexOf(enemy);
            if (eIdx !== -1) enemies.splice(eIdx, 1);
            spawnEnemy();
          } else {
            const ratio = Math.max(0.01, enemy.hp / enemy.maxHp);
            enemy.hpBar.fill.scale.x = ratio;
            enemy.hpBar.fill.position.x = -(1 - ratio) * 0.445;
            enemy.hpBar.fill.material.color.set(ratio > 0.5 ? 0x22c55e : (ratio > 0.25 ? 0xfacc15 : 0xef4444));
          }
        }
      } else {
        spawnBurst3D(fivemScene, first.point, 0xdbeafe, 4);
      }
    }

    spawnTracer3D(fivemScene, muzzleWorld, endPoint, 0xfff1a8);
    if (player.ammo === 0) startReload();
    updateFivemHud(true);
    updateTopHud(true);
  }

  function hasLineOfSight(from, to) {
    _vTmp1.copy(to).sub(from);
    const dist = _vTmp1.length();
    if (dist < 0.1) return true;
    raycaster.set(from, _vTmp1.divideScalar(dist));
    raycaster.far = dist - 0.3;
    const hits = raycaster.intersectObjects(fmObstacleMeshes, false);
    raycaster.far = Infinity;
    return hits.length === 0;
  }

  function updateFivem(dt, now) {
    const d = getDiff();
    if (player.fireCooldown > 0) player.fireCooldown -= dt;
    if (player.rollCooldown > 0) player.rollCooldown -= dt;
    if (player.muzzleTimer > 0) {
      player.muzzleTimer -= dt;
      if (player.muzzleTimer <= 0) playerRig.muzzleFlash.material.opacity = 0;
    }
    if (player.reloading) {
      player.reloadTimer -= dt;
      if (player.reloadTimer <= 0) {
        player.reloading = false;
        player.ammo = player.maxAmmo;
      }
    }
    if (player.firing) fireFivemWeapon();

    _vFwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    _vRight.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    _vMove.set(0, 0, 0);

    if (player.rolling) {
      player.rollTimer -= dt;
      player.pos.addScaledVector(player.rollDir, 10.2 * dt);
      const progress = 1 - Math.max(0, player.rollTimer / player.rollDuration);
      playerRig.bodyPivot.rotation.x = -progress * Math.PI * 2;
      if (player.rollTimer <= 0) {
        player.rolling = false;
        playerRig.bodyPivot.rotation.x = 0;
      }
    } else {
      if (keys['KeyW']) _vMove.add(_vFwd);
      if (keys['KeyS']) _vMove.sub(_vFwd);
      if (keys['KeyD']) _vMove.add(_vRight);
      if (keys['KeyA']) _vMove.sub(_vRight);
      const speed = player.ads ? 4.6 : 7.4;
      if (_vMove.lengthSq() > 0) {
        _vMove.normalize();
        player.pos.addScaledVector(_vMove, speed * dt);
        player.animPhase += dt * (player.ads ? 8 : 12.5);
      } else {
        player.animPhase *= 0.85;
      }
    }

    if (!player.onGround || player.vel.y !== 0) {
      player.vel.y -= 20 * dt;
      player.pos.y += player.vel.y * dt;
      if (player.pos.y <= 0) {
        player.pos.y = 0;
        player.vel.y = 0;
        player.onGround = true;
      }
    }

    resolveArenaCollision(player.pos, 0.5);
    playerRig.root.position.copy(player.pos);
    playerRig.root.rotation.y = player.yaw;

    const swing = _vMove.lengthSq() > 0 && !player.rolling ? Math.sin(player.animPhase) * 0.65 : 0;
    playerRig.leftLeg.rotation.x = swing;
    playerRig.rightLeg.rotation.x = -swing;
    playerRig.rightArm.rotation.x = player.pitch * 0.65;

    // Câmera 3ª Pessoa SUAVIZADA (elimina cortes/snaps em paredes e ADS!)
    const targetAds = player.ads ? 1 : 0;
    player.adsBlend += (targetAds - player.adsBlend) * Math.min(1, dt * 14);
    const desiredDist = 3.25 - player.adsBlend * 1.28;
    const rightOff = 0.82 - player.adsBlend * 0.14;
    const camHeight = 1.76 - player.adsBlend * 0.10;

    _vShoulder.copy(player.pos).add(_vTmp1.set(0, camHeight, 0)).addScaledVector(_vRight, rightOff);
    _vBackDir.set(
      Math.sin(player.yaw) * Math.cos(player.pitch),
      -Math.sin(player.pitch),
      Math.cos(player.yaw) * Math.cos(player.pitch)
    ).normalize();

    raycaster.set(_vShoulder, _vBackDir);
    raycaster.far = desiredDist;
    const camObs = raycaster.intersectObjects(fmObstacleMeshes, false);
    raycaster.far = Infinity;
    const targetDist = camObs.length > 0 ? Math.max(0.75, camObs[0].distance - 0.25) : desiredDist;

    // Interpolação suave na distância da câmera (rápida ao encolher, suave ao expandir)
    const damp = targetDist < player.camCurrentDist ? Math.min(1, dt * 22) : Math.min(1, dt * 9);
    player.camCurrentDist += (targetDist - player.camCurrentDist) * damp;

    camera.position.copy(_vShoulder).addScaledVector(_vBackDir, player.camCurrentDist);
    camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

    // -------- IA DOS INIMIGOS (MAIS DIFÍCIL, RÁPIDA E AGRESSIVA) --------
    const [rMin, rMax] = d.enemyRollInterval;
    const [fMin, fMax] = d.enemyFireInterval;

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.muzzleTimer > 0) {
        e.muzzleTimer -= dt;
        if (e.muzzleTimer <= 0) e.rig.muzzleFlash.material.opacity = 0;
      }

      if (e.role === 'ally') {
        e.allyLifeTimer -= dt;
        if (e.allyLifeTimer <= 0) {
          fivemScene.remove(e.rig.root);
          enemies.splice(i, 1);
          spawnEnemy('enemy');
          continue;
        }
      }

      const dxP = player.pos.x - e.pos.x;
      const dzP = player.pos.z - e.pos.z;
      const flatDist = Math.hypot(dxP, dzP);
      const lookYaw = Math.atan2(-dxP, -dzP);
      e.rig.root.rotation.y = lookYaw;

      const eFwdX = -Math.sin(lookYaw), eFwdZ = -Math.cos(lookYaw);
      const eRightX = Math.cos(lookYaw), eRightZ = -Math.sin(lookYaw);

      e.rollCooldown -= dt;
      e.strafeTimer -= dt;
      if (e.strafeTimer <= 0) {
        e.strafeDir = Math.random() > 0.5 ? 1 : -1;
        e.strafeTimer = 0.42 + Math.random() * 0.85;
      }

      if (e.role !== 'ally' && !e.rolling && e.rollCooldown <= 0 && flatDist < 26) {
        e.rolling = true;
        e.rollTimer = e.rollDuration;
        e.rollCooldown = rMin + Math.random() * (rMax - rMin);
        e.rollSide = Math.random() > 0.5 ? 1 : -1;
      }

      if (e.rolling) {
        e.rollTimer -= dt;
        const rollSpeed = d.enemySpeed * 1.55;
        e.pos.x += eRightX * e.rollSide * rollSpeed * dt;
        e.pos.z += eRightZ * e.rollSide * rollSpeed * dt;
        const prog = 1 - Math.max(0, e.rollTimer / e.rollDuration);
        e.rig.bodyPivot.rotation.z = -e.rollSide * prog * Math.PI * 2;
        if (e.rollTimer <= 0) {
          e.rolling = false;
          e.rig.bodyPivot.rotation.z = 0;
        }
      } else {
        const strafeSpd = e.role === 'leader' ? d.enemySpeed * 1.15 : d.enemySpeed;
        let mx = eRightX * e.strafeDir * strafeSpd;
        let mz = eRightZ * e.strafeDir * strafeSpd;
        if (flatDist > 17) { mx += eFwdX * (strafeSpd * 0.72); mz += eFwdZ * (strafeSpd * 0.72); }
        else if (flatDist < 7.5) { mx -= eFwdX * (strafeSpd * 0.6); mz -= eFwdZ * (strafeSpd * 0.6); }
        e.pos.x += mx * dt;
        e.pos.z += mz * dt;

        e.animPhase += dt * 11.5;
        const sw = Math.sin(e.animPhase) * 0.62;
        e.rig.leftLeg.rotation.x = sw;
        e.rig.rightLeg.rotation.x = -sw;
      }

      resolveArenaCollision(e.pos, 0.5);
      e.rig.root.position.copy(e.pos);
      e.hpBar.grp.lookAt(camera.position);

      if (e.role === 'ally') continue;

      // Marca o instante em que o inimigo entrou na linha de visão para medir reação real!
      _vTmp1.set(e.pos.x, e.pos.y + 1.48, e.pos.z);
      _vTmp2.set(player.pos.x, player.pos.y + 1.25, player.pos.z);
      const visible = flatDist < 35 && hasLineOfSight(_vTmp1, _vTmp2);
      if (visible && !e.firstSeenAt) e.firstSeenAt = now;

      e.fireTimer -= dt;
      if (!e.rolling && e.fireTimer <= 0 && visible) {
        const leaderMult = e.role === 'leader' ? 0.72 : 1.0;
        e.fireTimer = (fMin + Math.random() * (fMax - fMin)) * leaderMult;
        e.muzzleTimer = 0.055;
        e.rig.muzzleFlash.material.opacity = 1;
        playSound('enemy-shot');

        const muzzleW = new THREE.Vector3();
        e.rig.muzzlePoint.getWorldPosition(muzzleW);

        const movingBonus = (keys['KeyW'] || keys['KeyA'] || keys['KeyS'] || keys['KeyD']) ? 0.10 : 0;
        const rollBonus = player.rolling ? 0.36 : 0;
        const leaderBonus = e.role === 'leader' ? 0.12 : 0;
        const hitChance = Math.max(0.16, d.enemyBaseHitChance + leaderBonus - movingBonus - rollBonus);

        const aimTarget = _vTmp2.clone();
        const didHit = Math.random() < hitChance;
        if (!didHit) {
          aimTarget.x += (Math.random() > 0.5 ? 1 : -1) * (0.85 + Math.random() * 0.9);
          aimTarget.y += (Math.random() - 0.3) * 0.7;
        }
        spawnTracer3D(fivemScene, muzzleW, aimTarget, e.role === 'leader' ? 0xffd700 : 0xff5a36);

        if (didHit) {
          const [dMin, dMax] = d.enemyDamage;
          let dmgTaken = dMin + Math.floor(Math.random() * (dMax - dMin + 1));
          if (e.role === 'leader') dmgTaken = Math.round(dmgTaken * 1.35);
          if (player.rolling) dmgTaken = Math.max(4, Math.round(dmgTaken * 0.45));

          player.hp = Math.max(0, player.hp - dmgTaken);
          playSound('hurt');
          flashVignette('rgba(239, 68, 68, 0.44)');
          updateFivemHud(true);

          if (player.hp <= 0) {
            stopGame(true, 'VOCÊ FOI ELIMINADO!');
            return;
          }
        }
      }
    }
  }

  // ================= HUD COM CACHE (ZERO REFLOW DESNECESSÁRIO) =================
  function updateFivemHud(force = false) {
    const hpInt = Math.ceil(player.hp);
    if (force || hpInt !== hudCache.hp) {
      hudCache.hp = hpInt;
      hudHpVal.textContent = hpInt;
      const pct = Math.max(0, Math.min(100, (player.hp / player.maxHp) * 100));
      hudHpBar.style.width = pct + '%';
      if (pct > 55) {
        hudHpVal.style.color = '#4ade80';
        hudHpBar.style.background = 'linear-gradient(90deg, #16a34a, #4ade80)';
      } else if (pct > 25) {
        hudHpVal.style.color = '#facc15';
        hudHpBar.style.background = 'linear-gradient(90deg, #ca8a04, #facc15)';
      } else {
        hudHpVal.style.color = '#f87171';
        hudHpBar.style.background = 'linear-gradient(90deg, #dc2626, #f87171)';
      }
    }

    const ammoStr = player.reloading ? 'RELOAD' : String(player.ammo);
    if (force || ammoStr !== hudCache.ammo) {
      hudCache.ammo = ammoStr;
      hudAmmo.innerHTML = player.reloading
        ? `<span style="color:#facc15;font-size:14px;">RECARREGANDO...</span>`
        : `${player.ammo} <small>/ ∞</small>`;
    }

    const rollStr = player.rolling ? 'ROLANDO...' : (player.rollCooldown > 0 ? `ROLAMENTO ${player.rollCooldown.toFixed(1)}s` : 'ROLAMENTO PRONTO (SHIFT)');
    if (force || rollStr !== hudCache.roll) {
      hudCache.roll = rollStr;
      hudRollStatus.textContent = rollStr;
      hudRollStatus.style.color = player.rolling ? '#facc15' : (player.rollCooldown > 0 ? '#94a3b8' : 'var(--accent)');
    }
  }

  function updateTopHud(force = false) {
    const tStr = (cfg.duration === 0 ? elapsedTime : Math.max(0, timeLeft)).toFixed(1) + 's';
    if (force || tStr !== hudCache.time) { hudCache.time = tStr; hudTime.textContent = tStr; }

    const accStr = (stats.shots > 0 ? Math.round((stats.hits / stats.shots) * 100) : 100) + '%';
    if (force || accStr !== hudCache.acc) { hudCache.acc = accStr; hudAcc.textContent = accStr; }

    const avgRt = stats.reactionCount > 0 ? Math.round(stats.reactionSum / stats.reactionCount) + 'ms' : '--';
    const scoreStr = String(cfg.mode === 'gridshot' ? stats.score : stats.kills);
    const hitsStr = String(cfg.mode === 'gridshot' ? stats.hits : stats.headshots);

    if (force) {
      hudPrimaryLbl.textContent = cfg.mode === 'gridshot' ? 'Pontos' : 'Abates';
      hudHitsLbl.textContent = cfg.mode === 'gridshot' ? 'Acertos' : 'Headshots';
      hudExtraLbl.textContent = 'Reação';
    }
    if (force || scoreStr !== hudCache.score) { hudCache.score = scoreStr; hudScore.textContent = scoreStr; }
    if (force || hitsStr !== hudCache.hits) { hudCache.hits = hitsStr; hudHits.textContent = hitsStr; }
    if (force || avgRt !== hudCache.extra) { hudCache.extra = avgRt; hudExtra.textContent = avgRt; }
  }

  function refreshButtons() {
    btnStart.disabled = (state === 'playing');
    btnStart.textContent = state === 'paused' ? '▶ Retomar' : '▶ Iniciar';
    btnPause.disabled = (state !== 'playing');
    btnStop.disabled = (state === 'idle' || state === 'ended');
    crosshairEl.classList.toggle('visible', state === 'playing');
    fivemHud.classList.toggle('visible', cfg.mode === 'fivem');
  }

  function resetStats() {
    stats.score = 0; stats.hits = 0; stats.shots = 0;
    stats.kills = 0; stats.headshots = 0; stats.damageDealt = 0;
    stats.reactionSum = 0; stats.reactionCount = 0; stats.bestReaction = Infinity;
    stats.expiredTargets = 0; stats.decoyMistakes = 0; stats.priorityHits = 0; stats.streak = 0;
    timeLeft = cfg.duration;
    elapsedTime = 0;
  }

  function startGame() {
    ensureAudio();
    if (state === 'paused') { resumeGame(); return; }
    clearFx();
    resetStats();
    pendingMouseDX = 0; pendingMouseDY = 0;
    if (cfg.mode === 'gridshot') resetGridshot();
    else resetFivem();

    state = 'playing';
    centerOverlay.classList.add('hidden');
    ovStats.style.display = 'none';
    ovStopBtn.style.display = 'none';
    updateTopHud(true);
    refreshButtons();
    lockPointerSmooth();
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    player.firing = false;
    player.ads = false;
    pendingMouseDX = 0; pendingMouseDY = 0;
    if (document.pointerLockElement === canvas) {
      try { document.exitPointerLock(); } catch (e) {}
    }
    ovBadge.textContent = cfg.mode === 'gridshot' ? 'GRIDSHOT 3D • PAUSADO' : 'TREINO FIVEM • PAUSADO';
    ovTitle.textContent = 'Treino Pausado';
    ovDesc.textContent = 'Ajuste nível, sensibilidade, decisão rápida ou cores acima e clique em Retomar.';
    ovStats.style.display = 'none';
    ovPrimaryBtn.textContent = '▶ RETOMAR';
    ovStopBtn.style.display = 'inline-flex';
    centerOverlay.classList.remove('hidden');
    refreshButtons();
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    pendingMouseDX = 0; pendingMouseDY = 0;
    centerOverlay.classList.add('hidden');
    refreshButtons();
    lockPointerSmooth();
  }

  function stopGame(showSummary = true, customTitle = null) {
    state = 'ended';
    player.firing = false;
    player.ads = false;
    pendingMouseDX = 0; pendingMouseDY = 0;
    if (document.pointerLockElement === canvas) {
      try { document.exitPointerLock(); } catch (e) {}
    }
    refreshButtons();

    if (showSummary) {
      const acc = stats.shots > 0 ? Math.round((stats.hits / stats.shots) * 100) : 0;
      const avgRt = stats.reactionCount > 0 ? Math.round(stats.reactionSum / stats.reactionCount) + 'ms' : '--';
      const bestRt = Number.isFinite(stats.bestReaction) ? Math.round(stats.bestReaction) + 'ms' : '--';

      ovBadge.textContent = `${cfg.mode === 'gridshot' ? 'GRIDSHOT 3D' : 'FIVEM 3ª PESSOA'} • ${getDiff().label.toUpperCase()}`;
      ovTitle.textContent = customTitle || 'Treino Finalizado';

      if (cfg.mode === 'gridshot') {
        const kps = elapsedTime > 0 ? (stats.hits / elapsedTime).toFixed(2) : '0.00';
        ovDesc.textContent = `Ritmo: ${kps} alvos/s • Prioridades: ${stats.priorityHits} • Expirados: ${stats.expiredTargets} • Iscas acertadas: ${stats.decoyMistakes}`;
        document.getElementById('stLbl1').textContent = 'Pontos';
        document.getElementById('stVal1').textContent = stats.score;
        document.getElementById('stLbl2').textContent = 'Precisão';
        document.getElementById('stVal2').textContent = acc + '%';
        document.getElementById('stLbl3').textContent = 'Reação Méd.';
        document.getElementById('stVal3').textContent = avgRt;
        document.getElementById('stLbl4').textContent = 'Melhor MS';
        document.getElementById('stVal4').textContent = bestRt;
      } else {
        ovDesc.textContent = `Headshots: ${stats.headshots} • Líderes: ${stats.priorityHits} • Fogo Amigo: ${stats.decoyMistakes} • Dano: ${stats.damageDealt}`;
        document.getElementById('stLbl1').textContent = 'Abates';
        document.getElementById('stVal1').textContent = stats.kills;
        document.getElementById('stLbl2').textContent = 'Precisão';
        document.getElementById('stVal2').textContent = acc + '%';
        document.getElementById('stLbl3').textContent = 'Reação Méd.';
        document.getElementById('stVal3').textContent = avgRt;
        document.getElementById('stLbl4').textContent = 'Melhor MS';
        document.getElementById('stVal4').textContent = bestRt;
      }
      ovStats.style.display = 'grid';
      ovPrimaryBtn.textContent = '↻ TREINAR NOVAMENTE';
      ovStopBtn.style.display = 'none';
      centerOverlay.classList.remove('hidden');
    }
  }

  function setMode(newMode) {
    if (document.pointerLockElement === canvas) {
      try { document.exitPointerLock(); } catch (e) {}
    }
    cfg.mode = newMode;
    localStorage.setItem('aim3d_mode', newMode);
    state = 'idle';
    clearFx();
    resetStats();
    pendingMouseDX = 0; pendingMouseDY = 0;

    btnModeGridshot.classList.toggle('active', newMode === 'gridshot');
    btnModeFivem.classList.toggle('active', newMode === 'fivem');

    if (newMode === 'gridshot') {
      resetGridshot();
      ovBadge.textContent = `GRIDSHOT 3D • ${getDiff().label.toUpperCase()} • REAÇÃO & DECISÃO`;
      ovTitle.textContent = 'AimLab Gridshot 3D (Valorant)';
      ovDesc.innerHTML = 'Foco total em <b>tempo de reação</b> e <b>decisão rápida</b>: destrua os alvos antes do anel expirar, priorize os <b>Dourados (3x)</b> e <b>NÃO atire nas Iscas Vermelhas (X)</b>. Raw Input 100% Valorant.';
    } else {
      resetFivem();
      ovBadge.textContent = `FIVEM 3ª PESSOA • ${getDiff().label.toUpperCase()} • REAÇÃO & DECISÃO`;
      ovTitle.textContent = 'Treino FiveM PvP Hardcore';
      ovDesc.innerHTML = 'Inimigos rápidos que <b>rolam e atiram de volta</b>! Elimine para ganhar <b>+25 HP</b>, foque nos <b>Líderes Dourados (+40 HP)</b> e evite atirar em <b>Aliados Verdes</b>. Use <b>SHIFT/Q</b> para rolar.';
    }

    ovStats.style.display = 'none';
    ovPrimaryBtn.textContent = '▶ INICIAR TREINO';
    ovStopBtn.style.display = 'none';
    centerOverlay.classList.remove('hidden');
    updateLegend();
    updateTopHud(true);
    refreshButtons();
  }

  // ================= EVENTOS DA BARRA SUPERIOR =================
  btnModeGridshot.addEventListener('click', () => setMode('gridshot'));
  btnModeFivem.addEventListener('click', () => setMode('fivem'));
  btnStart.addEventListener('click', startGame);
  ovPrimaryBtn.addEventListener('click', startGame);
  btnPause.addEventListener('click', pauseGame);
  btnStop.addEventListener('click', () => stopGame(true));
  ovStopBtn.addEventListener('click', () => stopGame(true));

  btnFullscreen.addEventListener('click', () => {
    if (!document.fullscreenElement) trainerShell.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.().catch(() => {});
  });

  diffSelect.addEventListener('change', (e) => {
    cfg.diff = e.target.value;
    localStorage.setItem('aim3d_diff', cfg.diff);
    setMode(cfg.mode);
  });

  decisionToggle.addEventListener('change', (e) => {
    cfg.decision = e.target.checked;
    localStorage.setItem('aim3d_decision', String(cfg.decision));
    updateLegend();
    if (state === 'idle' || state === 'ended') setMode(cfg.mode);
  });

  function updateSens(val) {
    const clean = Math.max(0.05, Math.min(5.0, parseFloat(val) || 0.35));
    cfg.sens = clean;
    localStorage.setItem('aim3d_sens', clean.toFixed(2));
    sensNumber.value = clean.toFixed(2);
    sensSlider.value = Math.min(2.5, clean);
  }
  sensSlider.addEventListener('input', (e) => updateSens(e.target.value));
  sensNumber.addEventListener('change', (e) => updateSens(e.target.value));

  timeSelect.addEventListener('change', (e) => {
    cfg.duration = parseInt(e.target.value, 10);
    localStorage.setItem('aim3d_time', String(cfg.duration));
    if (state === 'idle' || state === 'ended') {
      timeLeft = cfg.duration;
      updateTopHud(true);
    }
  });

  bgColorPicker.addEventListener('input', (e) => {
    cfg.bgColor = e.target.value;
    localStorage.setItem('aim3d_bg', cfg.bgColor);
    applyVisualColors();
  });

  targetColorPicker.addEventListener('input', (e) => {
    cfg.targetColor = e.target.value;
    localStorage.setItem('aim3d_target', cfg.targetColor);
    applyVisualColors();
  });

  // ================= LOOP PRINCIPAL 3D =================
  let lastTs = performance.now();
  let hudTick = 0;

  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, (now - lastTs) / 1000);
    lastTs = now;

    if (state === 'playing') {
      // Aplica o giro da câmera sincronizado com o frame (zero cortes!)
      applyPendingMouseLook();

      elapsedTime += dt;
      if (cfg.duration > 0) {
        timeLeft -= dt;
        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTopHud(true);
          stopGame(true, 'TEMPO ESGOTADO!');
          return;
        }
      }

      if (cfg.mode === 'gridshot') {
        camera.position.set(0, 2.5, 0);
        camera.rotation.set(gridPitch, gridYaw, 0, 'YXZ');
        updateGridOrbs(dt, now);
      } else {
        updateFivem(dt, now);
      }

      // Atualiza HUD numérico a cada 80ms (suave, zero travadas de DOM!)
      hudTick += dt;
      if (hudTick >= 0.08) {
        hudTick = 0;
        updateTopHud(false);
        if (cfg.mode === 'fivem') updateFivemHud(false);
      }
    } else {
      if (cfg.mode === 'gridshot') {
        for (const o of activeOrbs) {
          if (o.pop < 1) o.pop = Math.min(1, o.pop + dt * 10);
          o.group.scale.setScalar(o.radius * o.pop);
          o.ring.lookAt(camera.position);
        }
        camera.position.set(0, 2.5, 0);
        camera.rotation.set(gridPitch, gridYaw, 0, 'YXZ');
      } else {
        const previewAngle = now * 0.00022;
        camera.position.set(
          player.pos.x + Math.sin(previewAngle) * 4.5,
          2.2,
          player.pos.z + Math.cos(previewAngle) * 4.5
        );
        camera.lookAt(player.pos.x, 1.3, player.pos.z - 2);
      }
    }

    updateFx(dt);
    renderer.render(cfg.mode === 'gridshot' ? gridScene : fivemScene, camera);
  }

  setMode(cfg.mode);
  applyVisualColors();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
