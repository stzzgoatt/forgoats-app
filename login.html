<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Community For Goats • Autenticação</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at 24% 48%, rgba(0, 128, 255, 0.16), transparent 52%),
                        linear-gradient(135deg, #04060a 0%, #080c14 55%, #05070c 100%);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }
        /* Fundo com animação de partículas (linhas interligadas) */
        canvas#bgCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .split-shell {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            align-items: stretch;
        }
        /* LATERAL ESQUERDA: Imagem 1 em cima, Imagem 2 embaixo */
        .brand-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 26px 28px 24px 28px;
            background: linear-gradient(180deg, rgba(10, 18, 32, 0.55) 0%, rgba(5, 8, 15, 0.78) 100%);
            border-right: 1px solid rgba(56, 168, 255, 0.16);
            overflow: hidden;
        }
        .brand-panel::before {
            content: '';
            position: absolute;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 145, 255, 0.24) 0%, rgba(0, 145, 255, 0) 70%);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .brand-statue-wrap {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            width: 100%;
            max-height: 285px;
        }
        .brand-statue {
            max-width: 92%;
            max-height: 275px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 22px rgba(0, 150, 255, 0.38));
            animation: statueFloat 4.5s ease-in-out infinite;
        }
        @keyframes statueFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .brand-logo-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 8px;
        }
        .brand-logo {
            max-width: 94%;
            max-height: 118px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 16px rgba(0, 140, 255, 0.35));
        }

        /* LATERAL DIREITA: Login */
        .auth-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 32px;
            background: rgba(8, 10, 15, 0.72);
            backdrop-filter: blur(8px);
        }
        .login-card {
            width: 100%;
            max-width: 330px;
            background: rgba(15, 19, 28, 0.88);
            padding: 28px 26px 26px 26px;
            border-radius: 14px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(56, 168, 255, 0.14);
            text-align: center;
        }
        .login-heading {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #6ab8ff;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }
        .tab {
            background: none;
            border: none;
            color: #6b7688;
            font-weight: 700;
            font-size: 12.5px;
            letter-spacing: 0.8px;
            cursor: pointer;
            margin: 0 16px;
            padding-bottom: 6px;
            transition: color 0.25s, border-color 0.25s;
        }
        .tab.active {
            color: #ffffff;
            border-bottom: 2px solid #29a3ff;
        }
        .input-group {
            position: relative;
            margin-bottom: 13px;
        }
        input {
            width: 100%;
            padding: 12px 14px 12px 38px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.25s ease;
        }
        input::placeholder {
            color: #687385;
        }
        input:focus {
            border-color: #29a3ff;
            background: rgba(255, 255, 255, 0.07);
            outline: none;
            box-shadow: 0 0 10px rgba(41, 163, 255, 0.2);
        }
        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #7d8da6;
            font-size: 13px;
        }
        #tokenGroup {
            display: none;
        }
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            color: #7c8799;
            margin: 4px 0 18px 0;
        }
        .options-row label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #a9b5c7;
        }
        .options-row input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
            accent-color: #29a3ff;
        }
        button.action-btn {
            width: 100%;
            padding: 12.5px;
            background: linear-gradient(90deg, #1a8cff 0%, #38b6ff 100%);
            border: none;
            color: #ffffff;
            font-weight: 800;
            font-size: 12.5px;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(26, 140, 255, 0.35);
            transition: filter 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        button.action-btn:hover {
            filter: brightness(1.08);
            box-shadow: 0 8px 22px rgba(41, 163, 255, 0.48);
        }
        button.action-btn:active {
            transform: scale(0.98);
        }
        button.action-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        #message {
            margin-top: 14px;
            font-size: 12px;
            min-height: 18px;
            font-weight: 500;
            line-height: 1.35;
        }
    </style>
</head>
<body>

    <!-- Fundo dinâmico com partículas interligadas -->
    <canvas id="bgCanvas"></canvas>

    <div class="split-shell">
        <!-- LATERAL ESQUERDA: Primeira imagem em cima, segunda embaixo -->
        <section class="brand-panel">
            <div class="brand-statue-wrap">
                <img src="brand-statue.png" alt="Community For Goats" class="brand-statue">
            </div>
            <div class="brand-logo-wrap">
                <img src="brand-logo.png" alt="Community For Goats Logo" class="brand-logo">
            </div>
        </section>

        <!-- LATERAL DIREITA: Login / Registo -->
        <section class="auth-panel">
            <div class="login-card">
                <div class="login-heading">Acesso Exclusivo</div>

                <div class="tabs">
                    <button class="tab active" id="tabLogin" onclick="switchMode('login')">LOGIN</button>
                    <button class="tab" id="tabRegister" onclick="switchMode('register')">REGISTAR</button>
                </div>

                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" id="userInput" placeholder="Username" autocomplete="off" spellcheck="false">
                </div>

                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="passInput" placeholder="••••••••" autocomplete="off">
                </div>

                <!-- Barra extra exclusiva para o Token na primeira ativação / registo -->
                <div class="input-group" id="tokenGroup">
                    <span class="input-icon">🔑</span>
                    <input type="text" id="tokenInput" placeholder="Token de Acesso (GOATS-XXXX)" autocomplete="off" spellcheck="false">
                </div>

                <div class="options-row" id="rememberRow">
                    <label><input type="checkbox" id="rememberMe"> Lembrar-me</label>
                    <span style="color: #5b6980;">Anti-Bular HWID Ativo</span>
                </div>

                <button class="action-btn" id="submitBtn" onclick="handleSubmit()">ENTRAR</button>
                <div id="message"></div>
            </div>
        </section>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let isRegisterMode = false;

        function switchMode(mode) {
            isRegisterMode = (mode === 'register');
            const tokenGroup = document.getElementById('tokenGroup');
            const submitBtn = document.getElementById('submitBtn');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const rememberRow = document.getElementById('rememberRow');

            if (isRegisterMode) {
                tokenGroup.style.display = 'block';
                submitBtn.innerText = 'CRIAR CONTA & VINCULAR';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                rememberRow.style.display = 'none';
            } else {
                tokenGroup.style.display = 'none';
                submitBtn.innerText = 'ENTRAR';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                rememberRow.style.display = 'flex';
            }
            document.getElementById('message').innerText = '';
        }

        function handleSubmit() {
            const user = document.getElementById('userInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const token = document.getElementById('tokenInput').value.trim();
            const msgDiv = document.getElementById('message');

            if (!user || !pass) {
                msgDiv.style.color = '#ff5555';
                msgDiv.innerText = 'Preencha o utilizador e a palavra-passe.';
                return;
            }

            if (isRegisterMode && !token) {
                msgDiv.style.color = '#ff5555';
                msgDiv.innerText = 'Insira o seu token de acesso para registar.';
                return;
            }

            msgDiv.style.color = '#8cb7e8';
            msgDiv.innerText = isRegisterMode ? 'A registar e a validar HWID...' : 'A autenticar utilizador...';
            document.getElementById('submitBtn').disabled = true;

            const rememberMe = document.getElementById('rememberMe').checked;

            ipcRenderer.send('processar-auth', {
                action: isRegisterMode ? 'register' : 'login',
                username: user,
                password: pass,
                token: token,
                rememberMe: rememberMe
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('submitBtn').disabled) {
                handleSubmit();
            }
        });

        ipcRenderer.on('resposta-auth', (event, response) => {
            document.getElementById('submitBtn').disabled = false;
            const msgDiv = document.getElementById('message');
            msgDiv.style.color = response.success ? '#4dff9a' : '#ff5f6d';
            msgDiv.innerText = response.message;
        });

        // Script de animação das partículas e linhas interligadas no fundo
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.7,
                vy: (Math.random() - 0.5) * 0.7,
                radius: Math.random() * 1.8 + 1
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(72, 180, 255, 0.42)';
            ctx.strokeStyle = 'rgba(72, 180, 255, 0.1)';
            ctx.lineWidth = 1;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 115) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
