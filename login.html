<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Community For Goats • Autenticação</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* Fundo com animação de partículas (linhas interligadas) */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .login-container {
            position: relative;
            z-index: 2;
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Foto de Perfil Redonda */
        .profile-pic-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #121212;
            border: 2px solid #2a2a2a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: -45px;
            z-index: 3;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Caixa do Painel de Login */
        .login-card {
            background: #121212;
            padding: 60px 35px 35px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9);
            width: 100%;
            border: 1px solid #222;
            text-align: center;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }
        .tab {
            background: none;
            border: none;
            color: #666;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin: 0 15px;
            padding-bottom: 5px;
            transition: color 0.3s;
        }
        .tab.active {
            color: #fff;
            border-bottom: 2px solid #fff;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 13px 15px 13px 40px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #fff;
            background: #222;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 14px;
        }
        #tokenGroup {
            display: none;
        }
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }
        .options-row label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .options-row input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
        }
        button.action-btn {
            width: 100%;
            padding: 13px;
            background: #ffffff;
            border: none;
            color: #000;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button.action-btn:hover {
            background: #e0e0e0;
        }
        button.action-btn:active {
            transform: scale(0.98);
        }
        #message {
            margin-top: 15px;
            font-size: 12px;
            min-height: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Fundo dinâmico com partículas interligadas -->
    <canvas id="bgCanvas"></canvas>

    <div class="login-container">
        <!-- Foto de Perfil Local -->
        <div class="profile-pic-container">
            <img src="perfil.jpg" alt="Perfil" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'90\' height=\'90\'><rect width=\'100%\' height=\'100%\' fill=\'%231a1a1a\'/><text x=\'50%\' y=\'55%\' fill=\'%23666\' font-size=\'30\' text-anchor=\'middle\' dominant-baseline=\'middle\'>👤</text></svg>'">
        </div>

        <div class="login-card">
            <div class="tabs">
                <button class="tab active" id="tabLogin" onclick="switchMode('login')">LOGIN</button>
                <button class="tab" id="tabRegister" onclick="switchMode('register')">REGISTAR</button>
            </div>

            <div class="input-group">
                <span class="input-icon">👤</span>
                <input type="text" id="userInput" placeholder="Username" autocomplete="off" spellcheck="false">
            </div>

            <div class="input-group">
                <span class="input-icon">🔒</span>
                <input type="password" id="passInput" placeholder="••••••••" autocomplete="off">
            </div>

            <!-- Barra extra exclusiva para o Token na primeira ativação / registo -->
            <div class="input-group" id="tokenGroup">
                <span class="input-icon">🔑</span>
                <input type="text" id="tokenInput" placeholder="Token de Acesso (GOATS-XXXX)" autocomplete="off" spellcheck="false">
            </div>

            <div class="options-row" id="rememberRow">
                <label><input type="checkbox" id="rememberMe"> Lembrar-me</label>
                <span style="color: #555;">Anti-Bular HWID Ativo</span>
            </div>

            <button class="action-btn" id="submitBtn" onclick="handleSubmit()">ENTRAR</button>
            <div id="message"></div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let isRegisterMode = false;

        function switchMode(mode) {
            isRegisterMode = (mode === 'register');
            const tokenGroup = document.getElementById('tokenGroup');
            const submitBtn = document.getElementById('submitBtn');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const rememberRow = document.getElementById('rememberRow');

            if (isRegisterMode) {
                tokenGroup.style.display = 'block';
                submitBtn.innerText = 'CRIAR CONTA & VINCULAR';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                rememberRow.style.display = 'none';
            } else {
                tokenGroup.style.display = 'none';
                submitBtn.innerText = 'ENTRAR';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                rememberRow.style.display = 'flex';
            }
            document.getElementById('message').innerText = '';
        }

        function handleSubmit() {
            const user = document.getElementById('userInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const token = document.getElementById('tokenInput').value.trim();
            const msgDiv = document.getElementById('message');

            if (!user || !pass) {
                msgDiv.style.color = '#ff5555';
                msgDiv.innerText = 'Preencha o utilizador e a palavra-passe.';
                return;
            }

            if (isRegisterMode && !token) {
                msgDiv.style.color = '#ff5555';
                msgDiv.innerText = 'Insira o seu token de acesso para registar.';
                return;
            }

            msgDiv.style.color = '#888';
            msgDiv.innerText = isRegisterMode ? 'A registar e a validar HWID...' : 'A autenticar utilizador...';
            document.getElementById('submitBtn').disabled = true;

            const rememberMe = document.getElementById('rememberMe').checked;

            ipcRenderer.send('processar-auth', {
                action: isRegisterMode ? 'register' : 'login',
                username: user,
                password: pass,
                token: token,
                rememberMe: rememberMe
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('submitBtn').disabled) {
                handleSubmit();
            }
        });

        ipcRenderer.on('resposta-auth', (event, response) => {
            document.getElementById('submitBtn').disabled = false;
            const msgDiv = document.getElementById('message');
            msgDiv.style.color = response.success ? '#55ff55' : '#ff5555';
            msgDiv.innerText = response.message;
        });

        // Script de animação das partículas e linhas interligadas no fundo
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 45; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                radius: Math.random() * 1.8 + 1
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 110) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
