<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Community For Goats • Autenticação</title>
    <style>
        :root {
            --bg-color: #000000;
            --theme-color: #00e5ff;
            --text-main: #ffffff;
            --text-muted: color-mix(in srgb, var(--text-main) 60%, transparent);
            --border-color: color-mix(in srgb, var(--text-main) 10%, transparent);
            --surface-bg: color-mix(in srgb, var(--text-main) 4%, transparent);
        }
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        html, body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }
        body {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }
        /* Barra do programa da mesma cor do fundo */
        .titlebar {
            position: relative;
            z-index: 10;
            height: 36px;
            min-height: 36px;
            width: 100%;
            background: transparent;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px 0 12px;
            -webkit-app-region: drag;
        }
        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            opacity: 0.9;
        }
        .titlebar-left img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
        .titlebar-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            -webkit-app-region: no-drag;
        }
        .tb-btn {
            width: 30px;
            height: 26px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s, color 0.18s;
        }
        .tb-btn:hover {
            background: color-mix(in srgb, var(--text-main) 10%, transparent);
            color: var(--text-main);
        }
        .tb-btn.close:hover {
            background: rgba(255, 65, 85, 0.25);
            color: #ff6b7a;
        }

        /* Fundo com animação de partículas (linhas interligadas) */
        canvas#bgCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .split-shell {
            position: relative;
            z-index: 2;
            flex: 1;
            width: 100%;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            align-items: stretch;
            background: transparent;
        }
        /* LATERAL ESQUERDA: Imagem 1 em cima, Imagem 2 embaixo */
        .brand-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 28px 22px 28px;
            background: transparent;
            border-right: 1px solid var(--border-color);
            overflow: hidden;
        }
        .brand-panel::before {
            content: '';
            position: absolute;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--theme-color) 18%, transparent) 0%, transparent 70%);
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .brand-statue-wrap {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            width: 100%;
            max-height: 280px;
        }
        .brand-statue {
            max-width: 92%;
            max-height: 270px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 22px color-mix(in srgb, var(--theme-color) 38%, transparent));
            animation: statueFloat 4.5s ease-in-out infinite;
        }
        @keyframes statueFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .brand-logo-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 8px;
        }
        .brand-logo {
            max-width: 94%;
            max-height: 116px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 16px color-mix(in srgb, var(--theme-color) 35%, transparent));
        }

        /* LATERAL DIREITA: Login */
        .auth-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 30px;
            background: transparent;
        }
        .login-card {
            width: 100%;
            max-width: 340px;
            background: var(--surface-bg);
            padding: 28px 26px 26px 26px;
            border-radius: 14px;
            border: 1px solid color-mix(in srgb, var(--theme-color) 24%, var(--border-color));
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .login-heading {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--theme-color);
            font-weight: 700;
            margin-bottom: 16px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 12.5px;
            letter-spacing: 0.8px;
            cursor: pointer;
            margin: 0 16px;
            padding-bottom: 6px;
            transition: color 0.25s, border-color 0.25s;
        }
        .tab.active {
            color: var(--theme-color);
            border-bottom: 2px solid var(--theme-color);
        }
        .input-group {
            position: relative;
            margin-bottom: 13px;
        }
        input {
            width: 100%;
            padding: 12px 14px 12px 38px;
            background: color-mix(in srgb, var(--text-main) 5%, transparent);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.25s ease;
        }
        input::placeholder {
            color: var(--text-muted);
        }
        input:focus {
            border-color: var(--theme-color);
            background: color-mix(in srgb, var(--text-main) 8%, transparent);
            outline: none;
            box-shadow: 0 0 10px color-mix(in srgb, var(--theme-color) 25%, transparent);
        }
        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
        }
        #tokenGroup {
            display: none;
        }
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            color: var(--text-muted);
            margin: 4px 0 18px 0;
        }
        .options-row label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
            opacity: 0.85;
        }
        .options-row input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
            accent-color: var(--theme-color);
        }
        button.action-btn {
            width: 100%;
            padding: 12.5px;
            background: var(--theme-color);
            border: none;
            color: #000000;
            font-weight: 800;
            font-size: 12.5px;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 6px 18px color-mix(in srgb, var(--theme-color) 38%, transparent);
            transition: filter 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        button.action-btn:hover {
            filter: brightness(1.08);
            box-shadow: 0 8px 22px color-mix(in srgb, var(--theme-color) 52%, transparent);
        }
        button.action-btn:active {
            transform: scale(0.98);
        }
        button.action-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        #message {
            margin-top: 14px;
            font-size: 12px;
            min-height: 18px;
            font-weight: 500;
            line-height: 1.35;
        }
    </style>
</head>
<body>

    <!-- Barra superior da mesma cor do fundo -->
    <div class="titlebar">
        <div class="titlebar-left">
            <img src="ico.png" alt="Icon">
            <span>Community For Goats • Autenticação</span>
        </div>
        <div class="titlebar-controls">
            <button class="tb-btn" id="login-min-btn" title="Minimizar">&#8211;</button>
            <button class="tb-btn close" id="login-close-btn" title="Fechar">&times;</button>
        </div>
    </div>

    <!-- Fundo dinâmico com partículas interligadas -->
    <canvas id="bgCanvas"></canvas>

    <div class="split-shell">
        <!-- LATERAL ESQUERDA: Primeira imagem em cima, segunda embaixo -->
        <section class="brand-panel">
            <div class="brand-statue-wrap">
                <img src="brand-statue.png" alt="Community For Goats" class="brand-statue">
            </div>
            <div class="brand-logo-wrap">
                <img src="brand-logo.png" alt="Community For Goats Logo" class="brand-logo">
            </div>
        </section>

        <!-- LATERAL DIREITA: Login / Registo -->
        <section class="auth-panel">
            <div class="login-card">
                <div class="login-heading">Acesso Exclusivo</div>

                <div class="tabs">
                    <button class="tab active" id="tabLogin" onclick="switchMode('login')">LOGIN</button>
                    <button class="tab" id="tabRegister" onclick="switchMode('register')">REGISTAR</button>
                </div>

                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" id="userInput" placeholder="Username" autocomplete="off" spellcheck="false">
                </div>

                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="passInput" placeholder="••••••••" autocomplete="off">
                </div>

                <!-- Barra extra exclusiva para o Token na primeira ativação / registo -->
                <div class="input-group" id="tokenGroup">
                    <span class="input-icon">🔑</span>
                    <input type="text" id="tokenInput" placeholder="Token de Acesso (GOATS-XXXX)" autocomplete="off" spellcheck="false">
                </div>

                <div class="options-row" id="rememberRow">
                    <label><input type="checkbox" id="rememberMe"> Lembrar-me</label>
                    <span>Anti-Bular HWID Ativo</span>
                </div>

                <button class="action-btn" id="submitBtn" onclick="handleSubmit()">ENTRAR</button>
                <div id="message"></div>
            </div>
        </section>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let isRegisterMode = false;
        let currentThemeColor = '#00e5ff';

        function hexToRgba(hex, alpha) {
            const clean = (hex || '#00e5ff').replace('#', '').trim();
            if (clean.length === 3) {
                const r = parseInt(clean[0] + clean[0], 16);
                const g = parseInt(clean[1] + clean[1], 16);
                const b = parseInt(clean[2] + clean[2], 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }
            if (clean.length === 6) {
                const r = parseInt(clean.slice(0, 2), 16);
                const g = parseInt(clean.slice(2, 4), 16);
                const b = parseInt(clean.slice(4, 6), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }
            return `rgba(0, 229, 255, ${alpha})`;
        }

        function applyLoginTheme(theme) {
            const accent = (theme && theme.accent) || localStorage.getItem('particlesColor') || '#00e5ff';
            const bg = (theme && theme.bg) || localStorage.getItem('themeBg') || '#000000';
            const text = (theme && theme.text) || localStorage.getItem('themeText') || '#ffffff';

            currentThemeColor = accent;
            const root = document.documentElement;
            root.style.setProperty('--theme-color', accent);
            root.style.setProperty('--bg-color', bg);
            root.style.setProperty('--text-main', text);

            // Contraste automático do texto do botão principal
            const clean = accent.replace('#', '');
            if (clean.length === 6) {
                const r = parseInt(clean.slice(0, 2), 16);
                const g = parseInt(clean.slice(2, 4), 16);
                const b = parseInt(clean.slice(4, 6), 16);
                const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                const btn = document.getElementById('submitBtn');
                if (btn) btn.style.color = lum > 155 ? '#000000' : '#ffffff';
            }
        }

        // Carrega tema sincronizado do processo principal imediatamente
        try {
            const initialTheme = ipcRenderer.sendSync('get-theme');
            applyLoginTheme(initialTheme);
        } catch (e) {
            applyLoginTheme(null);
        }

        ipcRenderer.on('theme-updated', (event, theme) => {
            applyLoginTheme(theme);
        });

        document.getElementById('login-min-btn').addEventListener('click', () => {
            ipcRenderer.send('login-min');
        });
        document.getElementById('login-close-btn').addEventListener('click', () => {
            ipcRenderer.send('login-close');
        });

        function switchMode(mode) {
            isRegisterMode = (mode === 'register');
            const tokenGroup = document.getElementById('tokenGroup');
            const submitBtn = document.getElementById('submitBtn');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const rememberRow = document.getElementById('rememberRow');

            if (isRegisterMode) {
                tokenGroup.style.display = 'block';
                submitBtn.innerText = 'CRIAR CONTA & VINCULAR';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                rememberRow.style.display = 'none';
            } else {
                tokenGroup.style.display = 'none';
                submitBtn.innerText = 'ENTRAR';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                rememberRow.style.display = 'flex';
            }
            document.getElementById('message').innerText = '';
        }

        function handleSubmit() {
            const user = document.getElementById('userInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const token = document.getElementById('tokenInput').value.trim();
            const msgDiv = document.getElementById('message');

            if (!user || !pass) {
                msgDiv.style.color = '#ff5555';
                msgDiv.innerText = 'Preencha o utilizador e a palavra-passe.';
                return;
            }

            if (isRegisterMode && !token) {
                msgDiv.style.color = '#ff5555';
                msgDiv.innerText = 'Insira o seu token de acesso para registar.';
                return;
            }

            msgDiv.style.color = currentThemeColor;
            msgDiv.innerText = isRegisterMode ? 'A registar e a validar HWID...' : 'A autenticar utilizador...';
            document.getElementById('submitBtn').disabled = true;

            const rememberMe = document.getElementById('rememberMe').checked;

            ipcRenderer.send('processar-auth', {
                action: isRegisterMode ? 'register' : 'login',
                username: user,
                password: pass,
                token: token,
                rememberMe: rememberMe
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('submitBtn').disabled) {
                handleSubmit();
            }
        });

        ipcRenderer.on('resposta-auth', (event, response) => {
            document.getElementById('submitBtn').disabled = false;
            const msgDiv = document.getElementById('message');
            msgDiv.style.color = response.success ? '#4dff9a' : '#ff5f6d';
            msgDiv.innerText = response.message;
        });

        // Script de animação das partículas e linhas interligadas no fundo
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.7,
                vy: (Math.random() - 0.5) * 0.7,
                radius: Math.random() * 1.8 + 1
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = hexToRgba(currentThemeColor, 0.45);
            ctx.strokeStyle = hexToRgba(currentThemeColor, 0.14);
            ctx.lineWidth = 1;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 115) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
